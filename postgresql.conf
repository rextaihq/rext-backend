# PGTune for Hetzner CX33: 8 GB RAM, 4 vCPU, SSD
# Web application workload (many short queries)
# Generated via https://pgtune.leopard.in.ua/

# Connection
max_connections = 200

# Memory
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 10MB
huge_pages = off

# WAL
wal_buffers = 64MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# Query Planner (SSD-optimized)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Parallelism
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# JIT off for web workloads (simple queries, JIT overhead not worth it)
jit = off

# Safety — prevent runaway queries and abandoned transactions
statement_timeout = 60000
idle_in_transaction_session_timeout = 300000

# Logging — log queries slower than 1 second
log_min_duration_statement = 1000

# Extensions
shared_preload_libraries = 'pg_stat_statements'
