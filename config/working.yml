name: DEV_CI_CD

on:
  pull_request:
    types:
      - closed
    branches:
      - dev
jobs:
  build:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
     
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            libnss3 \
            libfreetype6 \
            libharfbuzz0b \
            ca-certificates \
            bash \
            libstdc++6 \
            && sudo apt-get clean

      - name: Install uv and Python dependencies
        run: pip install uv && uv pip install --system --no-cache-dir playwright crawl4ai

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Setup Crawl4AI
        run: |
          crawl4ai-setup
          crawl4ai-doctor

  docker_job:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install LangGraph CLI
        run: pip install langgraph-cli
          
      - name: Build Docker image with LangGraph
        run: langgraph build -t  ${{ secrets.DOCKER_USERNAME }}/wrext:dev

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/wrext:dev
  
  deploy:
    needs: docker_job
    runs-on: self-hosted

    env:
      # Image tag for docker-compose
      IMAGE_TAG: dev
      
      # Environment settings
      ENVIRONMENT: development
      DEBUG: "true"
      
      # Core API Keys
      OPENAI_API_KEY: ${{ secrets.DEV_OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.DEV_LANGSMITH_API_KEY }}
      
      # Database
      POSTGRES_URI_CUSTOM: ${{ secrets.DEV_POSTGRES_URI_CUSTOM }}
      DATABASE_URI: ${{ secrets.DEV_DATABASE_URI }}
      REDIS_URI: ${{ secrets.DEV_REDIS_URI }}
      REDIS_URL: ${{ secrets.DEV_REDIS_URL }}
      
      # Security
      SECRET_KEY: ${{ secrets.DEV_SECRET_KEY }}
      REFRESH_SECRET_KEY: ${{ secrets.DEV_REFRESH_SECRET_KEY }}
      ALGORITHM: ${{ secrets.DEV_ALGORITHM }}
      
      # Frontend + CORS
      FRONTEND_URL: ${{ secrets.DEV_FRONTEND_URL }}
      ALLOWED_ORIGINS: ${{ secrets.DEV_ALLOWED_ORIGINS }}
      
      # Admin
      SUPER_ADMIN_EMAIL: ${{ secrets.DEV_SUPER_ADMIN_EMAIL }}
      SUPER_ADMIN_PASSWORD: ${{ secrets.DEV_SUPER_ADMIN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Docker to DEV
        run: |
          # Ensure correct working directory for DEV
          DEPLOY_DIR=~/WREXT/dev/backend
          mkdir -p $DEPLOY_DIR
          cp -r $GITHUB_WORKSPACE/* $DEPLOY_DIR/
          cd $DEPLOY_DIR

          echo "🚀 Starting DEV deployment..."

          # Create .env file dynamically from GitHub secrets
          cat > .env <<EOF
          IMAGE_TAG=dev
          ENVIRONMENT=development
          DEBUG=true

          # Core API Keys
          OPENAI_API_KEY=${{ secrets.DEV_OPENAI_API_KEY }}
          LANGSMITH_API_KEY=${{ secrets.DEV_LANGSMITH_API_KEY }}

          # Database
          POSTGRES_URI_CUSTOM=${{ secrets.DEV_POSTGRES_URI_CUSTOM }}
          DATABASE_URI=${{ secrets.DEV_DATABASE_URI }}
          REDIS_URI=${{ secrets.DEV_REDIS_URI }}
          REDIS_URL=${{ secrets.DEV_REDIS_URL }}

          # Security
          SECRET_KEY=${{ secrets.DEV_SECRET_KEY }}
          REFRESH_SECRET_KEY=${{ secrets.DEV_REFRESH_SECRET_KEY }}
          ALGORITHM=${{ secrets.DEV_ALGORITHM }}

          # Frontend + CORS
          FRONTEND_URL=${{ secrets.DEV_FRONTEND_URL }}
          ALLOWED_ORIGINS=${{ secrets.DEV_ALLOWED_ORIGINS }}

          # Admin
          SUPER_ADMIN_EMAIL=${{ secrets.DEV_SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD=${{ secrets.DEV_SUPER_ADMIN_PASSWORD }}
          EOF

          echo ".env file created ✅"

          # Log in to Docker
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          # Pull latest DEV image
          docker pull revnixhq/wrext:dev

          # Stop and remove old containers
          docker compose down || true

          # Start containers (Docker Compose will automatically load .env)
          docker compose up -d

          # Clean up old images
          docker image prune -f

          # Show running containers
          docker ps

          echo "✅ DEV Deployment completed successfully."
