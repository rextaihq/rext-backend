name: PRODUCTION_CI_CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Production: NEVER cancel in-progress deployments — queue instead
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # 🔍 Stage 1 — Quality Gate (lint + security + FULL tests)
  # ──────────────────────────────────────────────
  quality:
    uses: ./.github/workflows/ci-quality.yaml

  # ──────────────────────────────────────────────
  # ⏳ Stage 1b — One deploy per merge window
  # ──────────────────────────────────────────────
  window:
    name: ⏳ Merge Window
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for the merge window to close
        # Merges reach main in two windows an hour, minutes 00-09 and 30-39 UTC, so
        # that production restarts once a window, not after every merge. A build
        # takes minutes: a run that went ahead at once deployed the window's first
        # merges, and its later ones brought a second restart. So a run whose push
        # came inside a window waits here for that window's end (and 20 seconds
        # more, for a merge begun in its last second). By then main holds every
        # merge of the window, the stale check below refuses all but the newest
        # run, and that one deploys them together. The quality gate runs meanwhile.
        #
        # The window is the push's, read from when the run was created: a push
        # just before a window, or one that queued into the next, is not held, and
        # a run whose window has passed (it queued, or it is run again) goes on at
        # once. A manual run never waits here.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date -u +%s)
          PUSHED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.created_at | fromdateiso8601' 2> /dev/null || true)
          case "$PUSHED" in
            ''|*[!0-9]*)
              echo "::warning::The run's start time could not be read: taking the time now as the push's"
              PUSHED=$NOW ;;
          esac
          INTO=$(( PUSHED % 1800 ))
          if [ "$INTO" -ge 600 ]; then
            echo "Pushed outside a merge window: no wait"
            exit 0
          fi
          WAIT=$(( PUSHED - INTO + 620 - NOW ))
          if [ "$WAIT" -le 0 ]; then
            echo "Pushed inside a merge window that has closed: no wait"
            exit 0
          fi
          echo "Pushed inside a merge window: waiting ${WAIT}s for it to close, so that one run deploys all of its merges"
          sleep "$WAIT"

  # ──────────────────────────────────────────────
  # 🐳 Stage 2a — Build & Push Backend Image to GHCR
  # ──────────────────────────────────────────────
  docker_job:
    name: 🐳 Build & Push Backend
    needs: [quality, window]
    # Only main publishes :latest: a manual run on another ref must not reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      pushed_digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Refuse a stale run
        # Publishing or deploying an older commit after a newer one would silently
        # roll production back: a re-run keeps its original commit, and GitHub
        # doesn't guarantee runs start in push order. Every push to main starts a
        # run, so this run must be for main's head. Roll back on purpose instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$HEAD" != "${{ github.sha }}" ]; then
            echo "::error::This run is for ${{ github.sha }}, but main is at $HEAD: refusing to publish or deploy an older commit"
            exit 1
          fi

      - name: Cleanup Runner (Pre-build)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LangGraph CLI
        run: pip install langgraph-cli

      - name: Record the commit in the image
        # /health/live reports it (src/api/build_info.py), so what production runs is visible.
        run: echo "${{ github.sha }}" > src/api/build_commit.txt

      - name: Build Docker image with LangGraph
        run: langgraph build -t ghcr.io/${{ github.repository_owner }}/rext-backend:latest

      - name: Tag with commit SHA for rollback
        run: |
          docker tag \
            ghcr.io/${{ github.repository_owner }}/rext-backend:latest \
            ghcr.io/${{ github.repository_owner }}/rext-backend:sha-${{ github.sha }}

      - name: Push Docker images to GHCR
        id: push
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/rext-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/rext-backend:sha-${{ github.sha }}
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' \
            ghcr.io/${{ github.repository_owner }}/rext-backend:latest | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed :latest @ $DIGEST"

      - name: Cleanup Docker (Post-build)
        if: always()
        run: |
          docker system prune -f
          df -h

  # ──────────────────────────────────────────────
  # 🐳 Stage 2b — Build & Push Shopify App Image to GHCR
  # ──────────────────────────────────────────────
  docker_shopify:
    name: 🐳 Build & Push Shopify App
    needs: [quality, window]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Refuse a stale run
        # Publishing or deploying an older commit after a newer one would silently
        # roll production back: a re-run keeps its original commit, and GitHub
        # doesn't guarantee runs start in push order. Every push to main starts a
        # run, so this run must be for main's head. Roll back on purpose instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$HEAD" != "${{ github.sha }}" ]; then
            echo "::error::This run is for ${{ github.sha }}, but main is at $HEAD: refusing to publish or deploy an older commit"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Shopify app image
        uses: docker/build-push-action@v6
        with:
          context: ./rext
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rext-shopify-app:latest
            ghcr.io/${{ github.repository_owner }}/rext-shopify-app:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rext-shopify-app:latest
          cache-to: type=inline

  # ──────────────────────────────────────────────
  # 🚀 Stage 3 — Deploy via Coolify
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Coolify Deploy
    needs: [docker_job, docker_shopify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # packages: a refused rollback points :latest back at the image production runs.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Refuse a rollback
        # Deploying a commit older than the one production runs would silently roll
        # it back: a re-run keeps its original commit, and GitHub doesn't guarantee
        # runs start in push order. Main moving on during the build is not that:
        # merges land every few minutes, and refusing every run whose commit is no
        # longer main's head kept production from deploying at all (2026-10-07).
        # So this run deploys when its commit is the one live serves or ahead of
        # it, compared through the GitHub API. If live reports no commit, the run
        # must be main's head, as before. Roll back on purpose instead.
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_URL: https://api.rext.ai/health/live
        run: |
          LIVE=$(curl -s --max-time 10 "$HEALTH_URL" | jq -r '.commit // empty' 2>/dev/null || true)
          if ! [[ "$LIVE" =~ ^[0-9a-f]{7,40}$ ]]; then
            HEAD=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
            if [ "$HEAD" != "${{ github.sha }}" ]; then
              echo "::error::Live reports no commit, and main is at $HEAD: refusing to deploy ${{ github.sha }}"
              exit 1
            fi
            echo "Live reports no commit; ${{ github.sha }} is main's head: deploying"
            exit 0
          fi
          STATUS=$(gh api "repos/${{ github.repository }}/compare/$LIVE...${{ github.sha }}" --jq .status)
          case "$STATUS" in
            ahead|identical) echo "Live runs $LIVE; ${{ github.sha }} is $STATUS of it: deploying" ;;
            *)
              echo "::error::Live runs $LIVE, and ${{ github.sha }} is $STATUS of it: refusing to roll production back"
              # This run's publish already pointed :latest at its image. Point it back at
              # the one production runs, so a later restart that pulls :latest can't roll
              # production back either.
              IMAGE=ghcr.io/${{ github.repository_owner }}/rext-backend
              echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin > /dev/null
              if docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:sha-$LIVE"; then
                echo "Pointed :latest back at sha-$LIVE"
              else
                echo "::warning::Could not point :latest back at sha-$LIVE: check :latest in GHCR before any restart"
              fi
              exit 1
              ;;
          esac

      - name: Wait for GHCR tag propagation (backend)
        env:
          EXPECTED: ${{ needs.docker_job.outputs.pushed_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR can serve the OLD :latest tag for seconds-to-minutes after a
          # push reports success. If Coolify pulls in that window it deploys
          # the previous image with a green pipeline (seen on stage 2026-09-29
          # and 2026-10-01). Refuse to deploy until the registry resolves
          # :latest to the digest we just pushed.
          TOKEN=$(curl -s -u "${{ github.actor }}:$GHCR_TOKEN" \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/rext-backend:pull" \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          echo "Waiting for :latest to resolve to $EXPECTED"
          for i in $(seq 1 18); do
            REMOTE=$(curl -s -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${{ github.repository_owner }}/rext-backend/manifests/latest" \
              -o /dev/null -D - | grep -i '^docker-content-digest:' | awk '{print $2}' | tr -d '\r')
            if [ "$REMOTE" = "$EXPECTED" ]; then
              echo "Registry serving the new digest (attempt $i)"; exit 0
            fi
            echo "attempt $i: registry at ${REMOTE:-unknown}, waiting 10s..."
            sleep 10
          done
          echo "::error::GHCR did not serve digest $EXPECTED for :latest within 3 minutes"
          exit 1

      - name: Restart the production backend with the new image
        run: |
          CLEAN_URL=$(echo "${{ secrets.COOLIFY_API_URL }}" | sed 's#/*$##; s#/api/v1$##')

          # The backend is a Coolify Service. /api/v1/deploy only starts a Service
          # with the images it already has, so :latest was never pulled again and
          # production kept old code. A restart with latest=true pulls the images
          # first; pgbouncer and minio-mirror are pinned by digest in the Service
          # (2026-10-06, #423), so only rext-backend changes. --url-query keeps the
          # parameter in the query string, URL-encoded.
          echo "Restarting rext-backend (production) with the latest images..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "$CLEAN_URL/api/v1/services/${{ secrets.COOLIFY_UUID_PROD }}/restart" \
            --url-query "latest=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Backend Coolify restart failed with HTTP $http_code. By hand: in Coolify, open the production project, then the rext-backend service, then Restart with \"Pull latest images\" ticked; then check that https://api.rext.ai/health/live reports ${{ github.sha }}."
            exit 1
          fi
          echo "✅ Backend restart queued"

      - name: Wait for production to run this commit
        timeout-minutes: 17
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_URL: https://api.rext.ai/health/live
          EXPECTED: ${{ github.sha }}
        run: |
          # The restart is queued: pulling the image and starting the stack takes
          # minutes. The deploy counts when the running server reports the commit
          # this run built (src/api/build_info.py), or a newer one that contains
          # it: a later run's deploy can land first.
          # A wall-clock deadline: a request that hangs counts against it too.
          DEADLINE=$((SECONDS + 900))
          RUNNING=none
          i=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            i=$((i + 1))
            RUNNING=$(curl -s --max-time 10 "$HEALTH_URL" | jq -r '.commit // "none"' 2>/dev/null || true)
            if [ "$RUNNING" = "$EXPECTED" ]; then
              echo "✅ Production runs $EXPECTED (attempt $i)"; exit 0
            fi
            if [[ "$RUNNING" =~ ^[0-9a-f]{7,40}$ ]] \
              && [ "$(gh api "repos/${{ github.repository }}/compare/$EXPECTED...$RUNNING" --jq .status 2>/dev/null)" = "ahead" ]; then
              echo "✅ Production runs $RUNNING, which contains $EXPECTED (a later run deployed first)"; exit 0
            fi
            echo "attempt $i: production runs ${RUNNING:-none}, waiting 15s..."
            sleep 15
          done
          echo "::error::Production did not run $EXPECTED within 15 minutes (last seen: ${RUNNING:-none}). The image is in GHCR (:latest and :sha-$EXPECTED). By hand: in Coolify, open the production project, then the rext-backend service; look at its logs for a failed pull or start, then Restart with \"Pull latest images\" ticked, and check that $HEALTH_URL reports $EXPECTED."
          exit 1

      - name: Trigger Coolify Deployment — Shopify App
        env:
          SHOPIFY_UUID: ${{ secrets.COOLIFY_UUID_SHOPIFY }}
        run: |
          # The Shopify app has no Coolify resource yet (Shopify is postponed, #288),
          # so the secret doesn't exist and Coolify would answer 400 "You must
          # provide uuid or tag." on every release. Until the founder sets it up,
          # the step says so and lets the run's result speak for the backend.
          if [ -z "$SHOPIFY_UUID" ]; then
            echo "::warning::Shopify app not deployed: COOLIFY_UUID_SHOPIFY is not set (no Coolify resource for it yet). The image is in GHCR as rext-shopify-app:latest."
            exit 0
          fi
          CLEAN_URL=$(echo "${{ secrets.COOLIFY_API_URL }}" | sed 's#/*$##; s#/api/v1$##')

          echo "Triggering Coolify deployment for rext-shopify-app..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "$CLEAN_URL/api/v1/deploy" \
            --url-query "uuid=$SHOPIFY_UUID" \
            --url-query "force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Shopify app Coolify deploy failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Shopify app deployment triggered"

  # ──────────────────────────────────────────────
  # ✅ Stage 4 — Smoke Test
  # ──────────────────────────────────────────────
  smoke:
    name: ✅ Smoke Test
    # After the deploy and beside it: no job needs this one, so a failure here turns
    # the run red and names the check, and can't block or undo a deploy. Signed-out
    # GET requests only (scripts/smoke.py): nothing is written on production.
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signed-out checks on production
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: https://api.rext.ai
          EXPECTED: ${{ github.sha }}
        run: |
          # A later run's deploy can land first: a running commit that contains
          # this run's counts, as it does for the deploy job.
          RUNNING=$(curl -s --max-time 10 "$API_URL/health/live" | jq -r '.commit // empty' 2>/dev/null || true)
          if [ "$RUNNING" != "$EXPECTED" ] && [[ "$RUNNING" =~ ^[0-9a-f]{40}$ ]] \
            && [ "$(gh api "repos/${{ github.repository }}/compare/$EXPECTED...$RUNNING" --jq .status 2>/dev/null)" = "ahead" ]; then
            echo "Production runs $RUNNING, which contains $EXPECTED (a later run deployed first)"
            EXPECTED=$RUNNING
          fi
          python3 scripts/smoke.py --api "$API_URL" --commit "$EXPECTED"

  # ──────────────────────────────────────────────
  # 📢 Stage 5 — Notification Summary
  # ──────────────────────────────────────────────
  notify:
    name: 📢 Summary
    needs: [quality, docker_job, docker_shopify, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 PRODUCTION Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Quality Gate | \`${{ needs.quality.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build Backend | \`${{ needs.docker_job.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build Shopify App | \`${{ needs.docker_shopify.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Coolify Deploy | \`${{ needs.deploy.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/rext-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "**Rollback tag:** \`ghcr.io/${{ github.repository_owner }}/rext-backend:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Fail pipeline on critical failures
        if: needs.quality.result == 'failure' || needs.docker_job.result == 'failure' || needs.docker_shopify.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          echo "::error::Production pipeline had critical failures. Check the summary above."
          exit 1
