name: PRODUCTION_CI_CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Free disk space ASAP
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      # 🔹 Cache only uv (not pip)
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            libnss3 \
            libfreetype6 \
            libharfbuzz0b \
            ca-certificates \
            bash \
            libstdc++6 \
            && sudo apt-get clean

      - name: Install Python tools
        run: |
          uv pip install --system --no-cache-dir playwright crawl4ai

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Setup Crawl4AI
        run: |
          crawl4ai-setup
          crawl4ai-doctor

      - name: Install dev dependencies
        run: uv sync --group dev

      # 🔹 Cleanup after build job
      - name: Cleanup after build
        run: |
          rm -rf ~/.cache/pip
          rm -rf ~/.cache/uv
          rm -rf ~/.cache/ms-playwright
          docker system prune -af
          df -h


  docker_job:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # 🔹 Free disk again
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install LangGraph CLI
        run: pip install langgraph-cli

      - name: Build Docker image with LangGraph
        run: langgraph build -t ${{ secrets.DOCKER_USERNAME }}/wrext:dev

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/wrext:dev

      - name: Cleanup Docker (Post-build)
        if: always()
        run: |
          docker system prune -af
          df -h