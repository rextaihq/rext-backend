name: DEV_CI_CD

on:
  pull_request:
    types:
      - closed
    branches:
      - dev

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 🔍 Stage 1 — Quality Gate (lint + security + tests)
  # ──────────────────────────────────────────────
  quality:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci-quality.yaml
    with:
      run_integration: false

  # ──────────────────────────────────────────────
  # 🐳 Stage 2 — Build & Push Docker Image to GHCR
  # ──────────────────────────────────────────────
  docker_job:
    name: 🐳 Build & Push
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Cleanup Runner (Pre-build)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Install LangGraph CLI
        run: pip install langgraph-cli

      - name: Build Docker image with LangGraph
        run: langgraph build -t ghcr.io/${{ github.repository_owner }}/wrext-backend:dev

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/wrext-backend:dev

      - name: Cleanup Docker (Post-build)
        if: always()
        run: |
          docker system prune -f
          df -h

  # ──────────────────────────────────────────────
  # 🚀 Stage 3 — Deploy via Coolify
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Coolify Deploy
    needs: docker_job
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify Deployment
        run: |
          # Clean the API URL: remove trailing slashes and redundant /api/v1
          CLEAN_URL=$(echo "${{ secrets.COOLIFY_API_URL }}" | sed 's#/*$##; s#/api/v1$##')
          
          echo "Triggering Coolify deployment for DEV..."
          response=$(curl -s -w "\n%{http_code}" --get \
            "$CLEAN_URL/api/v1/deploy" \
            --data-urlencode "uuid=${{ secrets.COOLIFY_UUID_DEV }}" \
            --data-urlencode "force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          # if [ "$http_code" != "200" ]; then
          #   echo "::error::Coolify deploy failed with HTTP $http_code"
          #   exit 1
          # fi
          # echo "✅ Coolify deployment triggered successfully"

  # ──────────────────────────────────────────────
  # ✅ Stage 4 — Smoke Test
  # ──────────────────────────────────────────────
  smoke_test:
    name: ✅ Smoke Test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for container startup
        run: sleep 30

      - name: Health check
        run: |
          echo "Checking DEV server health..."
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ vars.DEV_SERVER_URL }}/health" \
            --max-time 15 --retry 3 --retry-delay 10)

          # if [ "$status" = "200" ]; then
          #   echo "✅ Health check passed (HTTP $status)"
          # else
          #   echo "::warning::Health check returned HTTP $status"
          # fi

  # ──────────────────────────────────────────────
  # 📢 Stage 5 — Notification Summary
  # ──────────────────────────────────────────────
  notify:
    name: 📢 Summary
    needs: [quality, docker_job, deploy, smoke_test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 DEV Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.head_ref }}\` → \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Quality Gate | \`${{ needs.quality.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build & Push | \`${{ needs.docker_job.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Coolify Deploy | \`${{ needs.deploy.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Smoke Test | \`${{ needs.smoke_test.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/wrext-backend:dev\`" >> $GITHUB_STEP_SUMMARY