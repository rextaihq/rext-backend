name: DEV_CI_CD

on:
  pull_request:
    types:
      - closed
    branches:
      - dev

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 🔍 Stage 1 — Quality Gate (lint + security + tests)
  # ──────────────────────────────────────────────
  quality:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/ci-quality.yaml
    with:
      run_integration: false

  # ──────────────────────────────────────────────
  # 📢 Stage 5 — Notification Summary
  # ──────────────────────────────────────────────
  notify:
    name: 📢 Summary
    needs: [quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 DEV Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.head_ref }}\` → \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Quality Gate | \`${{ needs.quality.result }}\` |" >> $GITHUB_STEP_SUMMARY
