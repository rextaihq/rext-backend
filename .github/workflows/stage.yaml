name: STAGE_CI_CD

on:
  push:
    branches:
      - stage
  workflow_dispatch:

concurrency:
  group: stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 🔍 Stage 1 — Quality Gate (lint + security + tests)
  # ──────────────────────────────────────────────
  quality:
    uses: ./.github/workflows/ci-quality.yaml
    with:
      run_integration: false

  # ──────────────────────────────────────────────
  # 🐳 Stage 2 — Build & Push Docker Image to GHCR
  # ──────────────────────────────────────────────
  docker_job:
    name: 🐳 Build & Push
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Cleanup Runner (Pre-build)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LangGraph CLI
        run: pip install langgraph-cli

      - name: Generate Dockerfile from LangGraph config
        run: langgraph dockerfile Dockerfile.langgraph

      - name: Build & push backend image (with GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.langgraph
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rext-backend:stage
          cache-from: type=gha,scope=backend-stage
          cache-to: type=gha,mode=max,scope=backend-stage

      - name: Cleanup Docker (Post-build)
        if: always()
        run: |
          docker system prune -f
          df -h

  # ──────────────────────────────────────────────
  # 🐳 Stage 2b — Build & Push Shopify App Image to GHCR
  # ──────────────────────────────────────────────
  docker_shopify:
    name: 🐳 Build & Push Shopify App
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Shopify app image
        uses: docker/build-push-action@v6
        with:
          context: ./rext
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rext-shopify-app:stage
            ghcr.io/${{ github.repository_owner }}/rext-shopify-app:sha-${{ github.sha }}
          cache-from: type=gha,scope=shopify-stage
          cache-to: type=gha,mode=max,scope=shopify-stage

  # ──────────────────────────────────────────────
  # 🚀 Stage 3 — Deploy via Coolify
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Coolify Deploy
    needs: [docker_job, docker_shopify]
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify Deployment — Backend
        run: |
          CLEAN_URL=$(echo "${{ secrets.COOLIFY_API_URL }}" | sed 's#/*$##; s#/api/v1$##')

          echo "Triggering Coolify deployment for rext-backend (stage)..."
          response=$(curl -s -w "\n%{http_code}" --get \
            "$CLEAN_URL/api/v1/deploy" \
            --data-urlencode "uuid=${{ secrets.COOLIFY_UUID_STAGE }}" \
            --data-urlencode "force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Backend Coolify deploy failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Backend deployment triggered"

      - name: Trigger Coolify Deployment — Shopify App
        run: |
          CLEAN_URL=$(echo "${{ secrets.COOLIFY_API_URL }}" | sed 's#/*$##; s#/api/v1$##')

          echo "Triggering Coolify deployment for rext-shopify-app (stage)..."
          response=$(curl -s -w "\n%{http_code}" --get \
            "$CLEAN_URL/api/v1/deploy" \
            --data-urlencode "uuid=${{ secrets.COOLIFY_UUID_SHOPIFY_STAGE }}" \
            --data-urlencode "force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Shopify app Coolify deploy failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Shopify app deployment triggered"

  # ──────────────────────────────────────────────
  # ✅ Stage 4 — Smoke Test
  # ──────────────────────────────────────────────
