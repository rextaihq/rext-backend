name: STAGE_CI_CD

on:
  push:
    branches:
      - stage
  workflow_dispatch:

concurrency:
  group: stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 🔍 Stage 1 — Quality Gate (lint + security + tests)
  # ──────────────────────────────────────────────
  quality:
    uses: ./.github/workflows/ci-quality.yaml
    with:
      run_integration: false

  # ──────────────────────────────────────────────
  # 🐳 Stage 2 — Build & Push Docker Image to GHCR
  # ──────────────────────────────────────────────
  docker_job:
    name: 🐳 Build & Push
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Cleanup Runner (Pre-build)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LangGraph CLI
        run: pip install langgraph-cli

      - name: Build Docker image with LangGraph
        run: langgraph build -t ghcr.io/${{ github.repository_owner }}/wrext:stage

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/wrext:stage

      - name: Cleanup Docker (Post-build)
        if: always()
        run: |
          docker system prune -f
          df -h

  # ──────────────────────────────────────────────
  # 🚀 Stage 3 — Deploy via Coolify
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Coolify Deploy
    needs: docker_job
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify Deployment
        run: |
          echo "Triggering Coolify deployment for STAGE..."
          response=$(curl -s -w "\n%{http_code}" --get \
            "${{ secrets.COOLIFY_API_URL }}/api/v1/deploy" \
            --data-urlencode "uuid=${{ secrets.COOLIFY_UUID_STAGE }}" \
            --data-urlencode "force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Coolify deploy failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Coolify deployment triggered successfully"

  # ──────────────────────────────────────────────
  # ✅ Stage 4 — Smoke Test
  # ──────────────────────────────────────────────
  smoke_test:
    name: ✅ Smoke Test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for container startup
        run: sleep 45

      - name: Health check
        run: |
          echo "Checking STAGE server health..."
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ vars.STAGE_SERVER_URL }}/health" \
            --max-time 15 --retry 3 --retry-delay 10)

          if [ "$status" = "200" ]; then
            echo "✅ Health check passed (HTTP $status)"
          else
            echo "::warning::Health check returned HTTP $status"
          fi

      - name: Readiness check
        run: |
          echo "Checking STAGE server readiness..."
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ vars.STAGE_SERVER_URL }}/health/ready" \
            --max-time 15 --retry 3 --retry-delay 10)

          if [ "$status" = "200" ]; then
            echo "✅ Readiness check passed (HTTP $status)"
          else
            echo "::warning::Readiness check returned HTTP $status (database may be unavailable)"
          fi

  # ──────────────────────────────────────────────
  # 📢 Stage 5 — Notification Summary
  # ──────────────────────────────────────────────
  notify:
    name: 📢 Summary
    needs: [quality, docker_job, deploy, smoke_test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 STAGE Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`stage\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Quality Gate | \`${{ needs.quality.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build & Push | \`${{ needs.docker_job.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Coolify Deploy | \`${{ needs.deploy.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Smoke Test | \`${{ needs.smoke_test.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/wrext:stage\`" >> $GITHUB_STEP_SUMMARY
