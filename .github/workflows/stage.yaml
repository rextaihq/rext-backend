name: STAGE_CI_CD

on:
  push:
    branches:
      - stage
    paths:
      # Backend
      - 'src/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'scripts/**'
      - 'langgraph.json'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'Dockerfile'
      # Shopify app
      - 'rext/**'
      # Shared config / workflows
      - 'docker-compose.yml'
      - '.github/workflows/stage.yaml'
      - '.github/workflows/ci-quality.yaml'
  workflow_dispatch:

concurrency:
  group: stage-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────
# Detect which parts of the repo changed
# ──────────────────────────────────────────────
jobs:
  changes:
    name: 🔎 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      shopify: ${{ steps.filter.outputs.shopify }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'alembic/**'
              - 'alembic.ini'
              - 'scripts/**'
              - 'langgraph.json'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'Dockerfile'
              - 'docker-compose.yml'
            shopify:
              - 'rext/**'

  # ──────────────────────────────────────────────
  # 🔍 Stage 1 — Quality Gate (lint + security + tests)
  # Only runs when backend code changed
  # ──────────────────────────────────────────────
  quality:
    name: 🔍 Quality Gate
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-quality.yaml

  # ──────────────────────────────────────────────
  # 🐳 Stage 2 — Build & Push Backend Docker Image
  # ──────────────────────────────────────────────
  docker_job:
    name: 🐳 Build & Push Backend
    needs: [changes, quality]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Cleanup Runner (Pre-build)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LangGraph CLI
        run: pip install langgraph-cli

      - name: Build Docker image with LangGraph
        run: langgraph build --api-version 0.12.6 -t ghcr.io/${{ github.repository_owner }}/rext-backend:stage

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/rext-backend:stage

      - name: Cleanup Docker (Post-build)
        if: always()
        run: |
          docker system prune -f
          df -h

  # ──────────────────────────────────────────────
  # 🐳 Stage 2b — Build & Push Shopify App Image
  # ──────────────────────────────────────────────
  docker_shopify:
    name: 🐳 Build & Push Shopify App
    needs: changes
    if: needs.changes.outputs.shopify == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Shopify app image
        uses: docker/build-push-action@v6
        with:
          context: ./rext
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rext-shopify-app:stage
            ghcr.io/${{ github.repository_owner }}/rext-shopify-app:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rext-shopify-app:stage
          cache-to: type=inline

  # ──────────────────────────────────────────────
  # 🚀 Stage 3 — Deploy via Coolify
  # Runs if either backend or shopify image was built
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Coolify Deploy
    needs: [changes, docker_job, docker_shopify]
    if: |
      always() &&
      (needs.docker_job.result == 'success' || needs.docker_shopify.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify Deployment — Backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          CLEAN_URL=$(echo "${{ secrets.COOLIFY_API_URL }}" | sed 's#/*$##; s#/api/v1$##')

          echo "Triggering Coolify deployment for rext-backend (stage)..."
          response=$(curl -s -w "\n%{http_code}" --get \
            "$CLEAN_URL/api/v1/deploy" \
            --data-urlencode "uuid=${{ secrets.COOLIFY_UUID_STAGE }}" \
            --data-urlencode "force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Backend Coolify deploy failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Backend deployment triggered"

      - name: Trigger Coolify Deployment — Shopify App
        if: needs.changes.outputs.shopify == 'true'
        run: |
          CLEAN_URL=$(echo "${{ secrets.COOLIFY_API_URL }}" | sed 's#/*$##; s#/api/v1$##')

          echo "Triggering Coolify deployment for rext-shopify-app (stage)..."
          response=$(curl -s -w "\n%{http_code}" --get \
            "$CLEAN_URL/api/v1/deploy" \
            --data-urlencode "uuid=${{ secrets.COOLIFY_UUID_SHOPIFY_STAGE }}" \
            --data-urlencode "force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Shopify app Coolify deploy failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Shopify app deployment triggered"

  # ──────────────────────────────────────────────
  # 📢 Stage 4 — Notification Summary
  # ──────────────────────────────────────────────
  notify:
    name: 📢 Summary
    needs: [changes, quality, docker_job, docker_shopify, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 STAGE Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`stage\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔎 Changed — Backend | \`${{ needs.changes.outputs.backend }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔎 Changed — Shopify App | \`${{ needs.changes.outputs.shopify }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Quality Gate | \`${{ needs.quality.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build Backend | \`${{ needs.docker_job.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build Shopify App | \`${{ needs.docker_shopify.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Coolify Deploy | \`${{ needs.deploy.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image:** \`ghcr.io/${{ github.repository_owner }}/rext-backend:stage\`" >> $GITHUB_STEP_SUMMARY
          echo "**Shopify Image:** \`ghcr.io/${{ github.repository_owner }}/rext-shopify-app:stage\`" >> $GITHUB_STEP_SUMMARY
