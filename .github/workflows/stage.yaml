  #   name: ✅ Smoke Test
  #   needs: deploy
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Wait for container startup
  #       run: sleep 45

  #     - name: Health check
  #       run: |
  #         echo "Checking STAGE server health..."
  #         status=$(curl -s -o /dev/null -w "%{http_code}" \
  #           "${{ vars.STAGE_SERVER_URL }}/health" \
  #           --max-time 15 --retry 3 --retry-delay 10)

  #         if [ "$status" = "200" ]; then
  #           echo "✅ Health check passed (HTTP $status)"
  #         else
  #           echo "::warning::Health check returned HTTP $status"
  #         fi

  #     - name: Readiness check
  #       run: |
  #         echo "Checking STAGE server readiness..."
  #         status=$(curl -s -o /dev/null -w "%{http_code}" \
  #           "${{ vars.STAGE_SERVER_URL }}/health/ready" \
  #           --max-time 15 --retry 3 --retry-delay 10)

  #         if [ "$status" = "200" ]; then
  #           echo "✅ Readiness check passed (HTTP $status)"
  #         else
  #           echo "::warning::Readiness check returned HTTP $status (database may be unavailable)"
  #         fi

  # ──────────────────────────────────────────────
  # 📢 Stage 5 — Notification Summary
  # ──────────────────────────────────────────────
  notify:
    name: 📢 Summary
    needs: [quality, docker_job, docker_shopify, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 STAGE Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`stage\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Quality Gate | \`${{ needs.quality.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build Backend | \`${{ needs.docker_job.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build Shopify App | \`${{ needs.docker_shopify.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Coolify Deploy | \`${{ needs.deploy.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/wrext-backend:stage\`" >> $GITHUB_STEP_SUMMARY
