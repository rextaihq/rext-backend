name: STAGE_CI_CD

on:
  push:
    branches:
      - stage
    paths:
      # Backend
      - 'src/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'scripts/**'
      - 'langgraph.json'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'Dockerfile'
      # Shopify app
      - 'rext/**'
      # Shared config / workflows
      - 'docker-compose.yml'
      - '.github/workflows/stage.yaml'
      - '.github/workflows/ci-quality.yaml'
  workflow_dispatch:

concurrency:
  group: stage-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────
# Detect which parts of the repo changed
# ──────────────────────────────────────────────
jobs:
  changes:
    name: 🔎 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      shopify: ${{ steps.filter.outputs.shopify }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'alembic/**'
              - 'alembic.ini'
              - 'scripts/**'
              - 'langgraph.json'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'Dockerfile'
              - 'docker-compose.yml'
            shopify:
              - 'rext/**'

  # ──────────────────────────────────────────────
  # 🔍 Stage 1 — Quality Gate (lint + security + tests)
  # Only runs when backend code changed
  # ──────────────────────────────────────────────
  quality:
    name: 🔍 Quality Gate
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-quality.yaml

  # ──────────────────────────────────────────────
  # 🐳 Stage 2 — Build & Push Backend Docker Image
  # ──────────────────────────────────────────────
  docker_job:
    name: 🐳 Build & Push Backend
    needs: [changes, quality]
    # Only stage publishes :stage: a manual run on another ref must not reach staging.
    if: needs.changes.outputs.backend == 'true' && github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      pushed_digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Refuse a stale re-run
        # A re-run keeps its original commit: publishing or deploying it after a
        # newer one would silently roll staging back. Roll back on purpose instead.
        # A first attempt is always for the push that started it (a newer pending
        # run cancels an older one), and the path filter means stage's head may
        # be a later commit that started no run, so only re-runs are checked.
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api "repos/${{ github.repository }}/commits/stage" --jq .sha)
          if [ "$HEAD" != "${{ github.sha }}" ]; then
            echo "::error::This re-run is for ${{ github.sha }}, but stage is at $HEAD: refusing to publish or deploy an older commit"
            exit 1
          fi

      - name: Cleanup Runner (Pre-build)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LangGraph CLI
        run: pip install langgraph-cli

      - name: Record the commit in the image
        # /health/live reports it (src/api/build_info.py); the deploy job waits for it.
        run: echo "${{ github.sha }}" > src/api/build_commit.txt

      - name: Build Docker image with LangGraph
        run: langgraph build -t ghcr.io/${{ github.repository_owner }}/rext-backend:stage

      - name: Push Docker image to GHCR
        id: push
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/rext-backend:stage
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' \
            ghcr.io/${{ github.repository_owner }}/rext-backend:stage | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed :stage @ $DIGEST"

      - name: Cleanup Docker (Post-build)
        if: always()
        run: |
          docker system prune -f
          df -h

  # ──────────────────────────────────────────────
  # 🐳 Stage 2b — Build & Push Shopify App Image
  # ──────────────────────────────────────────────
  docker_shopify:
    name: 🐳 Build & Push Shopify App
    needs: changes
    if: needs.changes.outputs.shopify == 'true' && github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Refuse a stale re-run
        # A re-run keeps its original commit: publishing or deploying it after a
        # newer one would silently roll staging back. Roll back on purpose instead.
        # A first attempt is always for the push that started it (a newer pending
        # run cancels an older one), and the path filter means stage's head may
        # be a later commit that started no run, so only re-runs are checked.
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api "repos/${{ github.repository }}/commits/stage" --jq .sha)
          if [ "$HEAD" != "${{ github.sha }}" ]; then
            echo "::error::This re-run is for ${{ github.sha }}, but stage is at $HEAD: refusing to publish or deploy an older commit"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Shopify app image
        uses: docker/build-push-action@v6
        with:
          context: ./rext
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rext-shopify-app:stage
            ghcr.io/${{ github.repository_owner }}/rext-shopify-app:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rext-shopify-app:stage
          cache-to: type=inline

  # ──────────────────────────────────────────────
  # 🚀 Stage 3 — Deploy via Coolify
  # Runs if either backend or shopify image was built
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Coolify Deploy
    needs: [changes, docker_job, docker_shopify]
    if: |
      always() && github.ref == 'refs/heads/stage' &&
      (needs.docker_job.result == 'success' || needs.docker_shopify.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Refuse a stale re-run
        # A re-run keeps its original commit: publishing or deploying it after a
        # newer one would silently roll staging back. Roll back on purpose instead.
        # A first attempt is always for the push that started it (a newer pending
        # run cancels an older one), and the path filter means stage's head may
        # be a later commit that started no run, so only re-runs are checked.
        if: github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api "repos/${{ github.repository }}/commits/stage" --jq .sha)
          if [ "$HEAD" != "${{ github.sha }}" ]; then
            echo "::error::This re-run is for ${{ github.sha }}, but stage is at $HEAD: refusing to publish or deploy an older commit"
            exit 1
          fi

      - name: Wait for GHCR tag propagation (backend)
        if: needs.changes.outputs.backend == 'true'
        env:
          EXPECTED: ${{ needs.docker_job.outputs.pushed_digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR can serve the OLD :stage tag for seconds-to-minutes after a
          # push reports success. If Coolify pulls in that window it deploys
          # the previous image with a green pipeline (seen 2026-09-29 and
          # 2026-10-01). Refuse to deploy until the registry resolves :stage
          # to the digest we just pushed.
          IMAGE="ghcr.io/${{ github.repository_owner }}/rext-backend"
          TOKEN=$(curl -s -u "${{ github.actor }}:$GHCR_TOKEN" \
            "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/rext-backend:pull" \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          echo "Waiting for $IMAGE:stage to resolve to $EXPECTED"
          for i in $(seq 1 18); do
            REMOTE=$(curl -s -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${{ github.repository_owner }}/rext-backend/manifests/stage" \
              -o /dev/null -D - | grep -i '^docker-content-digest:' | awk '{print $2}' | tr -d '\r')
            if [ "$REMOTE" = "$EXPECTED" ]; then
              echo "Registry serving the new digest (attempt $i)"; exit 0
            fi
            echo "attempt $i: registry at ${REMOTE:-unknown}, waiting 10s..."
            sleep 10
          done
          echo "::error::GHCR did not serve digest $EXPECTED for :stage within 3 minutes"
          exit 1

      - name: Restart the staging backend with the new image
        if: needs.changes.outputs.backend == 'true'
        run: |
          CLEAN_URL=$(echo "${{ secrets.COOLIFY_API_URL }}" | sed 's#/*$##; s#/api/v1$##')

          # The backend is a Coolify Service. /api/v1/deploy only starts a Service
          # with the images it already has ("Service … started"), so :stage was
          # never pulled again and staging kept old code. A restart with
          # latest=true pulls the images first. --url-query keeps the parameter
          # in the query string, URL-encoded.
          echo "Restarting rext-backend (stage) with the latest images..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "$CLEAN_URL/api/v1/services/${{ secrets.COOLIFY_UUID_STAGE }}/restart" \
            --url-query "latest=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Backend Coolify restart failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Backend restart queued"

      - name: Wait for staging to run this commit
        if: needs.changes.outputs.backend == 'true'
        timeout-minutes: 17
        env:
          HEALTH_URL: https://staging-api.rext.ai/health/live
          EXPECTED: ${{ github.sha }}
        run: |
          # The restart is queued: pulling the image and starting the stack takes
          # minutes. The deploy counts only when the running server reports the
          # commit this run built (src/api/build_info.py).
          # A wall-clock deadline: a request that hangs counts against it too.
          DEADLINE=$((SECONDS + 900))
          RUNNING=none
          i=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            i=$((i + 1))
            RUNNING=$(curl -s --max-time 10 "$HEALTH_URL" | jq -r '.commit // "none"' 2>/dev/null || true)
            if [ "$RUNNING" = "$EXPECTED" ]; then
              echo "✅ Staging runs $EXPECTED (attempt $i)"; exit 0
            fi
            echo "attempt $i: staging runs ${RUNNING:-none}, waiting 15s..."
            sleep 15
          done
          echo "::error::Staging did not run $EXPECTED within 15 minutes (last seen: ${RUNNING:-none})"
          exit 1

      - name: Trigger Coolify Deployment — Shopify App
        if: needs.changes.outputs.shopify == 'true'
        run: |
          CLEAN_URL=$(echo "${{ secrets.COOLIFY_API_URL }}" | sed 's#/*$##; s#/api/v1$##')

          echo "Triggering Coolify deployment for rext-shopify-app (stage)..."
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "$CLEAN_URL/api/v1/deploy" \
            --url-query "uuid=${{ secrets.COOLIFY_UUID_SHOPIFY_STAGE }}" \
            --url-query "force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Response: $body"
          echo "HTTP Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Shopify app Coolify deploy failed with HTTP $http_code"
            exit 1
          fi
          echo "✅ Shopify app deployment triggered"

  # ──────────────────────────────────────────────
  # 📢 Stage 4 — Notification Summary
  # ──────────────────────────────────────────────
  notify:
    name: 📢 Summary
    needs: [changes, quality, docker_job, docker_shopify, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate deployment summary
        run: |
          echo "## 🚀 STAGE Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`stage\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔎 Changed — Backend | \`${{ needs.changes.outputs.backend }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔎 Changed — Shopify App | \`${{ needs.changes.outputs.shopify }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Quality Gate | \`${{ needs.quality.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build Backend | \`${{ needs.docker_job.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Build Shopify App | \`${{ needs.docker_shopify.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Coolify Deploy | \`${{ needs.deploy.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Image:** \`ghcr.io/${{ github.repository_owner }}/rext-backend:stage\`" >> $GITHUB_STEP_SUMMARY
          echo "**Shopify Image:** \`ghcr.io/${{ github.repository_owner }}/rext-shopify-app:stage\`" >> $GITHUB_STEP_SUMMARY
