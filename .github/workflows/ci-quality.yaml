name: CI Quality Gate

on:
  workflow_call:
    inputs:
      changed_python_only:
        description: Check only Python files changed by the caller PR.
        required: false
        type: boolean
        default: false

jobs:
  # ──────────────────────────────────────────────
  # 🧩 Import Integrity  (blocking — no continue-on-error)
  # ──────────────────────────────────────────────
  imports:
    name: 🧩 Import Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Resolves against git's index, so a module that exists only on a
      # developer's disk fails here exactly as it would at runtime.
      # Pure stdlib: no dependency install, fails in seconds not minutes.
      - name: Verify every module-level import resolves
        run: python scripts/check_imports.py --tracked

  # ──────────────────────────────────────────────
  # 🔍 Lint & Format Check
  # ──────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    # TODO: Remove continue-on-error once existing lint errors are fixed (~3700 remaining)
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install "ruff>=0.13.0"

      - name: Ruff checks for Python files changed by this PR
        if: inputs.changed_python_only
        run: |
          base="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          changed=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py')
          if [ -z "$changed" ]; then
            echo "No Python files changed in this PR."
            exit 0
          fi
          echo "$changed"
          echo "$changed" | xargs ruff check --force-exclude --output-format=github
          echo "$changed" | xargs ruff format --check --force-exclude

      - name: Ruff lint check
        if: ${{ !inputs.changed_python_only }}
        run: ruff check src --output-format=github

      - name: Ruff format check
        if: ${{ !inputs.changed_python_only }}
        run: ruff format --check src

  # ──────────────────────────────────────────────
  # 🔒 Dependency Security Scan
  # ──────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking until existing vulns are fixed
    steps:
      # The runner ran out of disk mid-job and died with
      # "No space left on device" before it could even write its own log.
      # The Android SDK alone is ~9 GB and nothing here uses it.
      - name: Cleanup Runner Disk
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          echo "after:"; df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run security audit
        continue-on-error: true  # Non-blocking until existing vulns are fixed
        run: |
          echo "## 🔒 Security Audit Results" >> $GITHUB_STEP_SUMMARY
          uv pip freeze --system 2>/dev/null | pip-audit -r /dev/stdin --desc 2>&1 | tee audit.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
