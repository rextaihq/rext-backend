name: CI Quality Gate

on:
  workflow_call:
    inputs:
      run_integration:
        description: 'Run integration tests alongside unit tests'
        required: false
        type: boolean
        default: false

jobs:
  # ──────────────────────────────────────────────
  # 🧩 Import Integrity  (blocking — no continue-on-error)
  # ──────────────────────────────────────────────
  imports:
    name: 🧩 Import Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Resolves against git's index, so a module that exists only on a
      # developer's disk fails here exactly as it would at runtime.
      # Pure stdlib: no dependency install, fails in seconds not minutes.
      - name: Verify every module-level import resolves
        run: python scripts/check_imports.py --tracked

  # ──────────────────────────────────────────────
  # 🔍 Lint & Format Check
  # ──────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    # TODO: Remove continue-on-error once existing lint errors are fixed (~3700 remaining)
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install "ruff>=0.13.0"

      - name: Ruff lint check
        run: ruff check src --output-format=github

      - name: Ruff format check
        run: ruff format --check src

  # ──────────────────────────────────────────────
  # 🔒 Dependency Security Scan
  # ──────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking until existing vulns are fixed
    steps:
      # The runner ran out of disk mid-job and died with
      # "No space left on device" before it could even write its own log.
      # The Android SDK alone is ~9 GB and nothing here uses it.
      - name: Cleanup Runner Disk
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          echo "after:"; df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run security audit
        continue-on-error: true  # Non-blocking until existing vulns are fixed
        run: |
          echo "## 🔒 Security Audit Results" >> $GITHUB_STEP_SUMMARY
          uv pip freeze --system 2>/dev/null | pip-audit -r /dev/stdin --desc 2>&1 | tee audit.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # 🧪 Tests + Coverage
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    # Non-blocking by request. NOTE: this is the setting that let the broken
    # image ship on 2026-09-02 -- the suite would have caught it and the
    # pipeline shipped anyway. The Import Integrity job stays blocking, so
    # that specific class of failure still cannot reach an image.
    continue-on-error: true
    env:
      ENVIRONMENT: testing
      SECRET_KEY: "temporary_secret_key_for_testing_purposes_only_32_chars"
      REFRESH_SECRET_KEY: "temporary_refresh_key_for_testing_purposes_only_32_chars"
      POSTGRES_URI_CUSTOM: "postgresql+asyncpg://postgres:rextserver@localhost:5432/rext"

    # tests/conftest.py has create_all commented out, so the suite expects a
    # database that already exists and is migrated. Without this service the
    # tests point at localhost:5432 with nothing listening and every
    # DB-touching test fails on connection refused.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rextserver
          POSTGRES_DB: rext
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # The runner ran out of disk mid-job and died with
      # "No space left on device" before it could even write its own log.
      # The Android SDK alone is ~9 GB and nothing here uses it.
      - name: Cleanup Runner Disk
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          echo "after:"; df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            libnss3 \
            libfreetype6 \
            libharfbuzz0b \
            ca-certificates \
            bash \
            libstdc++6 \
            && sudo apt-get clean

      # playwright + chromium + crawl4ai are several GB and are only needed
      # by integration tests. Unit runs skip them entirely.
      - name: Install playwright and crawl4ai
        if: inputs.run_integration
        run: uv pip install --system --no-cache-dir playwright crawl4ai

      - name: Install Playwright browser
        if: inputs.run_integration
        run: playwright install chromium

      - name: Setup Crawl4AI
        if: inputs.run_integration
        run: |
          crawl4ai-setup
          crawl4ai-doctor

      # conftest.py does not create tables; alembic owns the schema.
      # env.py reads POSTGRES_URI_CUSTOM and adds the asyncpg driver itself.
      - name: Run database migrations
        run: uv run python migrate.py upgrade

      - name: Run tests
        run: |
          if [ "${{ inputs.run_integration }}" = "true" ]; then
            echo "Running full test suite (unit + integration) on src..."
            uv run pytest src --tb=short -v
          else
            echo "Running unit tests only on src..."
            uv run pytest src -m "not integration and not slow" --tb=short -v
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7
