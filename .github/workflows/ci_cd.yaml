name: project_CI

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      # Cache pip packages (used by uv pip)
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
     
      - name: Install system dependencies
        if: steps.cache-uv-dependencies.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            libnss3 \
            libfreetype6 \
            libharfbuzz0b \
            ca-certificates \
            bash \
            libstdc++6 \
            && sudo apt-get clean

      - name: Install uv and Python dependencies
        # if: steps.cache-uv-dependencies.outputs.cache-hit != 'true'
        run: pip install uv && uv pip install --system --no-cache-dir playwright crawl4ai

      - name: Install Playwright browser
        if: steps.cache-uv-dependencies.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Setup Crawl4AI
        if: steps.cache-uv-dependencies.outputs.cache-hit != 'true'
        run: |
          crawl4ai-setup
          crawl4ai-doctor

  docker_job:
      needs: build 
      runs-on: ubuntu-latest

      steps:
        - name: Checkout the code
          uses: actions/checkout@v3

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log into Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Install LangGraph CLI
          run: pip install langgraph-cli
          
        - name: Build Docker image with LangGraph
          run: |
            langgraph build -t revnix/content-automation:latest

        - name: Push Docker image
          run: |
            docker push revnix/content-automation:latest
  
  deploy:
    needs: docker_job
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/app
            
            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Pull latest image
            docker pull revnix/content-automation:latest
            
            # Restart containers
            docker-compose down || true
            docker-compose up -d
            docker image prune -f
            docker ps