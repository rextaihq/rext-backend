name: project_CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted # runs on your Ubuntu server

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            libnss3 \
            libfreetype6 \
            libharfbuzz0b \
            ca-certificates \
            bash \
            libstdc++6 \
            && sudo apt-get clean

      - name: Install uv and Python dependencies
        run: pip install uv && uv pip install --system --no-cache-dir playwright crawl4ai

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Setup Crawl4AI
        run: |
          crawl4ai-setup
          crawl4ai-doctor

      - name: Build Docker image
        run: |
          docker build -t revnix/content-automation:latest .

      - name: Clean previous containers
        run: |
          docker-compose -f docker-compose.yml down || true

      - name: Deploy Docker containers
        run: |
          docker-compose -f docker-compose.yml up -d
          docker image prune -f
          docker ps
