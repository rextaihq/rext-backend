version: '3.8'

# Docker Swarm Production Stack for Rext Backend
# Optimized for million-user scalability with separated API and Worker roles.

volumes:
  langgraph-data:
    driver: local

services:
  # --- STATEFUL SERVICES (Pinned to Manager Node for Persistence) ---

  # Main Database
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: exec
      POSTGRES_PASSWORD: rextserver
      POSTGRES_DB: rext
    volumes:
      - langgraph-data:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
          - node.role == manager # Ensures data persists on the same server
      resources:
        limits:
          memory: 2G
    networks:
      - rext-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U exec" ]
      interval: 5s
      retries: 5

  # Application Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks:
      - rext-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s

  # LangGraph State Cache (Redis 6 as per your original config)
  langgraph-redis:
    image: redis:6
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 2G
    networks:
      - rext-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s

  # --- SCALABLE STATELESS SERVICES (Distributed across Cluster) ---

  # API Service: Handles incoming HTTP requests and user interactions
  rext-api:
    image: revnixhq/wrext:${IMAGE_TAG:-latest}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          cpus: '0.75'
          memory: 1.5G
        reservations:
          cpus: '0.25'
          memory: 1G
    networks:
      - rext-network
      - coolify
    env_file:
      - .env
    environment:
      # Overrides for Swarm Networking
      POSTGRES_URI_CUSTOM: postgresql://exec:rextserver@postgres:5432/rext
      DATABASE_URI: postgresql://exec:rextserver@postgres:5432/rext
      REDIS_URI: redis://langgraph-redis:6379/0
      REDIS_URL: redis://langgraph-redis:6379/0
      CACHE_URL: redis://redis:6379/0

      CORE_MODE: "api" # Use to disable background worker loops if needed
      HOST: 0.0.0.0
      PORT: 2024
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:2024/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker Service: Handles heavy scraping/LangGraph workflows
  rext-worker:
    image: revnixhq/wrext:${IMAGE_TAG:-latest}
    deploy:
      replicas: 4 # Scale this up based on user demand
      resources:
        limits:
          cpus: '1.5'
          memory: 2.5G
        reservations:
          cpus: '0.5'
          memory: 1.5G
      placement:
        constraints:
          - node.role == worker # Offload heavy work to worker nodes
    networks:
      - rext-network
    env_file:
      - .env
    environment:
      # Overrides for Swarm Networking
      POSTGRES_URI_CUSTOM: postgresql://exec:rextserver@postgres:5432/rext
      DATABASE_URI: postgresql://exec:rextserver@postgres:5432/rext
      REDIS_URI: redis://langgraph-redis:6379/0
      REDIS_URL: redis://langgraph-redis:6379/0
      CACHE_URL: redis://redis:6379/0

      CORE_MODE: "worker"
      BG_JOB_ISOLATED_LOOPS: "true"
      WORKER_CONCURRENCY: 2
      N_JOBS_PER_WORKER: "50"

networks:
  rext-network:
    driver: overlay
    attachable: true
  coolify:
    external: true
