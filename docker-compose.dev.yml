# Local development stack. Run it with:
#
#   docker compose -f docker-compose.dev.yml up
#
# docker-compose.yml in this repo is the Coolify/production file and is NOT
# usable locally (it pulls a prebuilt image and joins Coolify's external
# network). Keep the two separate.
#
# Every developer needs exactly one file to fill in: .env (copy .env.example).
# It must address the other services by their compose service name — postgres,
# redis, langgraph-redis, minio — never localhost, which inside a container
# means the container itself. .env.example already ships those values.
name: rext-dev

services:
  postgres:
    image: 'pgvector/pgvector:pg17'
    environment:
      POSTGRES_USER: rext
      POSTGRES_PASSWORD: rext
      POSTGRES_DB: rext
    ports:
      # 5433 on the host so this never fights a Postgres already installed locally.
      - '5433:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rext -d rext']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: 'redis:7-alpine'
    command: 'redis-server --appendonly yes'
    ports:
      - '6379:6379'
    volumes:
      - 'redisdata:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # LangGraph's own queue, kept separate from the app cache so flushing one
  # cannot wipe the other. Matches REDIS_URI in production.
  langgraph-redis:
    image: 'redis:7-alpine'
    ports:
      # 6380 to stay out of the way of the app cache above.
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # LangGraph's checkpointer/store database, separate from the application
  # database above. Production keeps these apart too (DATABASE_URI is wired to a
  # different server than POSTGRES_URI_CUSTOM), and the existing README and
  # COMMON-COMMANDS.md already refer to a "langgraph-postgres".
  langgraph-postgres:
    image: 'pgvector/pgvector:pg17'
    environment:
      POSTGRES_USER: rext
      POSTGRES_PASSWORD: rext
      POSTGRES_DB: langgraph
    ports:
      - '5434:5432'
    volumes:
      - 'langgraphdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rext -d langgraph']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub rather than the quay.io image production uses: quay.io is not
    # reachable from some networks the team works on, and this is byte-identical
    # upstream. Production is unaffected.
    image: 'minio/minio:latest'
    command: 'server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      # Browser console at http://localhost:9001 (minioadmin / minioadmin).
      - '9001:9001'
    volumes:
      - 'miniodata:/data'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Named explicitly so the migrate service can reuse this exact image rather
    # than building a second one. Without it, Compose builds a separate
    # rext-dev-migrate image, which doubles build time and lets the two drift
    # apart when build args differ.
    image: rext-dev-api:latest
    # Source is bind-mounted below, so edits on the host reload the server
    # inside the container. No rebuild needed for day-to-day work.
    volumes:
      - '.:/app'
    ports:
      - '2024:2024'
    env_file:
      - .env
    # Anchored so the one-shot migrate service below reuses exactly this
    # configuration. The two must never drift apart.
    environment: &backend-env
      # These are a safety net, NOT the source of truth for the api service.
      #
      # langgraph.json declares `"env": ".env"`, so `langgraph dev` loads that
      # file into the environment with override — it beats anything set here.
      # The migrate service does the opposite: pydantic-settings gives real
      # environment variables precedence over .env, so it uses these values.
      #
      # The practical consequence: your .env MUST use the service names below,
      # or the api talks to one database while migrate talks to another. See
      # "Filling in .env" in LOCAL-DEV.md.
      # Application data.
      POSTGRES_URI_CUSTOM: 'postgresql://rext:rext@postgres:5432/rext'
      # LangGraph runtime (checkpointer + store) — its own database.
      DATABASE_URI: 'postgresql://rext:rext@langgraph-postgres:5432/langgraph'
      REDIS_URL: 'redis://redis:6379/0'
      CACHE_URL: 'redis://redis:6379/0'
      REDIS_URI: 'redis://langgraph-redis:6379'
      MINIO_ENDPOINT: 'minio:9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: rext-media
      MINIO_USE_SSL: 'false'
      # Bind to all interfaces or the published port cannot reach it.
      HOST: 0.0.0.0
      PORT: '2024'
      ENVIRONMENT: development
      DEBUG: 'true'
    depends_on:
      # The API only starts once migrations have finished successfully, so
      # nobody has to remember to run them by hand after pulling.
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      langgraph-redis:
        condition: service_healthy
      minio:
        condition: service_started

  # One-shot: runs on every `up`, applies any new migrations, then exits.
  # `scripts/db.py migrate` is the repo's own entrypoint — it runs
  # `alembic upgrade head` and sets up the LangGraph store tables.
  #
  # Deliberately NOT `db.py seed`: that is reset + migrate and drops all data.
  # Alembic is idempotent, so a run with nothing pending is a fast no-op.
  migrate:
    # Same image as the api service — built once, used twice. Declaring `build`
    # here as well would produce a second image, and any difference in build
    # args between the two (INSTALL_BROWSERS, for instance) would silently give
    # you two different environments running the same code.
    image: rext-dev-api:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ['python', 'scripts/db.py', 'migrate']
    restart: 'no'
    volumes:
      - '.:/app'
    env_file:
      - .env
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      langgraph-postgres:
        condition: service_healthy

volumes:
  pgdata:
  langgraphdata:
  redisdata:
  miniodata:
