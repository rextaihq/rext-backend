# Ground truth for persona extraction.
#
# Every quality figure quoted about this feature has been an estimate against
# nothing. This file is the thing to measure against: a person writes down who
# a site actually publishes, and the harness reports what was found, what was
# missed, and what was invented.
#
# expect_people  - must be found. A miss is a recall failure.
# expect_absent  - must NOT be found. A hit is a precision failure, and these
#                  are the names that leaked in real runs: testimonial subjects,
#                  section headings, mastheads, other companies' staff.
# min_people     - the floor for a site whose roster is too large to list.
#
# Counts and confidence are deliberately not asserted. They move with a site's
# publishing and would make this file fail for reasons that are not regressions.

sites:
  - url: https://www.wpbeginner.com/
    verified_by: claude
    verified_on: 2026-08-26
    min_people: 8
    expect_people: [Nouman Yaqoob, Syed Balkhi, Christina Harris,
                    Chris Christoff, Chris Klosowski, Angie Meeker,
                    John Turner, Muneeb Karim]
    expect_absent: [Read More, Editorial Team, WPBeginner Blog]
    notes: Editorial Staff is expected, typed editorial_collective, not a person.

  - url: https://www.pcisecuritystandards.org/
    verified_by: claude
    verified_on: 2026-08-26
    min_people: 9
    expect_people: [Alicia Malone, Gina Gobeyn, Diana Greenhaw,
                    Andrew Jamieson, Nitin Bhatnagar]
    expect_absent: [PCI Perspectives, PCI Security Standards Council]
    notes: Publication name reached the roster at full confidence once.

  - url: https://revnix.com/
    verified_by: claude
    verified_on: 2026-08-26
    min_people: 1
    expect_people: [Mobeen Abdullah]
    expect_absent: [Noah Proser, Hannah Ross]
    notes: >
      Both absent names are client testimonials on the about page, written as
      curly-quoted blocks with no testimonial markup. Noah Proser is KitBash3D's
      COO and reached the roster as Revnix staff.

  - url: https://www.21stcenturyequipment.com/
    verified_by: claude
    verified_on: 2026-08-26
    min_people: 3
    expect_people: [Mike Wemhoff, Keith Kreps, Isabel Drobny]
    expect_absent: [Hear From Our Team]
    notes: Section heading above the staff cards, returned as a team member.

  - url: https://css-tricks.com/
    verified_by: claude
    verified_on: 2026-08-26
    min_people: 8
    expect_people: [Chris Coyier, Geoff Graham]
    expect_absent: []

  - url: https://www.smashingmagazine.com/
    verified_by: claude
    verified_on: 2026-08-26
    min_people: 6
    expect_people: [Vitaly Friedman]
    expect_absent: []

