services:
    # Redis for application cache
    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 1s
            retries: 5
        restart: unless-stopped
        networks:
            - rext-network

    # Redis for LangGraph
    langgraph-redis:
        image: redis:7-alpine
        command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 1s
            retries: 5
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 512M
        networks:
            - rext-network

    # Postgres Databases and also add some other secrets
    postgres:
        image: pgvector/pgvector:pg17
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - langgraph-data:/var/lib/postgresql/data
        command: >
            postgres
            -c shared_buffers=2GB
            -c effective_cache_size=6GB
            -c maintenance_work_mem=512MB
            -c work_mem=10MB
            -c wal_buffers=64MB
            -c min_wal_size=1GB
            -c max_wal_size=4GB
            -c checkpoint_completion_target=0.9
            -c random_page_cost=1.1
            -c effective_io_concurrency=200
            -c default_statistics_target=100
            -c max_worker_processes=4
            -c max_parallel_workers_per_gather=2
            -c max_parallel_workers=4
            -c max_parallel_maintenance_workers=2
            -c huge_pages=off
            -c jit=off
            -c max_connections=200
            -c statement_timeout=60000
            -c idle_in_transaction_session_timeout=300000
            -c log_min_duration_statement=1000
            -c shared_preload_libraries=pg_stat_statements
        deploy:
            resources:
                limits:
                    memory: 2G
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 5s
            retries: 5
        networks:
            - rext-network

    # Backend API Service
    rext-api:
        image: ghcr.io/revnix/rext-backend:${IMAGE_TAG:-latest}
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=coolify"
        deploy:
            replicas: 1 # Set to 1 to avoid 'container name must be unique' error in Coolify
            resources:
                limits:
                    cpus: '2.0'
                    memory: 2.5G
                reservations:
                    cpus: '0.5'
                    memory: 1.5G
        expose:
            - ${PORT:-2024}

        # Traefik labels are managed by Coolify — do not uncomment these manually
        # See Coolify dashboard > Applications > rext-backend for routing config
        networks:
            - rext-network
            - coolify
        depends_on:
            postgres:
                condition: service_healthy
            langgraph-redis:
                condition: service_healthy
        env_file:
            - .env
        environment:
            # Core API + Database
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
            LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-REXT}
            LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}

            # Database (Connect to host PostgreSQL)
            POSTGRES_URI_CUSTOM: ${POSTGRES_URI_CUSTOM}
            DATABASE_URI: ${DATABASE_URI}
            REDIS_URI: ${REDIS_URI:-redis://langgraph-redis:6379}
            REDIS_URL: ${REDIS_URL:-redis://redis:6379}
            CACHE_URL: ${CACHE_URL:-redis://redis:6379}

            # Security
            SECRET_KEY: ${SECRET_KEY}
            REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
            ALGORITHM: ${ALGORITHM:-HS256}

            # Server
            HOST: ${HOST:-0.0.0.0}
            PORT: ${PORT}

            # Frontend + CORS
            FRONTEND_URL: ${FRONTEND_URL}
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
            ENVIRONMENT: ${ENVIRONMENT}
            DEBUG: ${DEBUG:-false}

            # Rate Limiting
            RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
            RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1000}
            RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-10000}
            RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-100000}

            # File Uploads
            UPLOAD_DIR: ${UPLOAD_DIR:-/app/secure_uploads}
            MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
            ENABLE_VIRUS_SCAN: ${ENABLE_VIRUS_SCAN:-false}

            # Email (Resend)
            EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
            EMAIL_ENABLED: ${EMAIL_ENABLED:-true}

            # Resend
            RESEND_API_KEY: ${RESEND_API_KEY}
            RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
            RESEND_FROM_NAME: ${RESEND_FROM_NAME}
            RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
            SMTP_SERVER: ${SMTP_SERVER}
            SMTP_PORT: ${SMTP_PORT}
            SMTP_USERNAME: ${SMTP_USERNAME}
            SMTP_PASSWORD: ${SMTP_PASSWORD}
            SMTP_USE_TLS: ${SMTP_USE_TLS}
            EMAIL_RETRY_ENABLED: ${EMAIL_RETRY_ENABLED}
            EMAIL_RETRY_MAX_ATTEMPTS: ${EMAIL_RETRY_MAX_ATTEMPTS}
            EMAIL_RETRY_DELAY_SECONDS: ${EMAIL_RETRY_DELAY_SECONDS}

            # Payment (LemonSqueezy)
            PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-lemonsqueezy}
            PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-USD}
            PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL}
            PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL}


            # Admin
            SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
            SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
            SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME}

            # Monitoring
            SENTRY_DSN: ${SENTRY_DSN}
            SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
            CACHE_ENABLED: ${CACHE_ENABLED:-true}

            # Feature Flags
            FF_PROFILE_IMPORTS: ${FF_PROFILE_IMPORTS:-false}
            BG_JOB_ISOLATED_LOOPS: "true"
            N_JOBS_PER_WORKER: "50"

            # Connection pooling (FIXED)
            REDIS_MAX_CONNECTIONS: "50"

            # TTL - CRITICAL for 8GB (auto-delete old threads)
            CHECKPOINTER_TTL_DEFAULT: 86400 # 24hr
            STORE_TTL_DEFAULT: 604800 # 7 days

            # Efficiency
            WORKER_CONCURRENCY: 2

            # Payment
            LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET}
            LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY}
            LEMONSQUEEZY_SANDBOX_MODE: ${LEMONSQUEEZY_SANDBOX_MODE}
            LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID}
            
            # Encription
            FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}

            # Data For Seo
            DATAFORSEO_AUTH_HEADER: ${DATAFORSEO_AUTH_HEADER}
            DATAFORSEO_SERP_URL: ${DATAFORSEO_SERP_URL}
            DATAFORSEO_BACKLINKS_URL: ${DATAFORSEO_BACKLINKS_URL}

            # Tavily Search
            TAVILY_API_KEY: ${TAVILY_API_KEY}

            # MinIO Storage
            MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
            MINIO_BUCKET: ${MINIO_BUCKET:-rext-media}
            MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
            MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}

    # MinIO Storage Service
    minio:
        image: quay.io/minio/minio:latest
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
        volumes:
            - minio_data:/data
        ports:
            - "9000:9000"   # S3 API
            - "9001:9001"   # Web console
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        networks:
            - rext-network

networks:
    rext-network:
        driver: bridge
    coolify:
        external: true

volumes:
    langgraph-data:
        driver: local
    minio_data:
        driver: local
