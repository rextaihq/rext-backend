volumes:
    langgraph-data:
        driver: local
services:
    # Redis for application cache (separate from LangGraph)
    redis:
        image: redis:7-alpine
        container_name: wrext-redis
        ports:
            - "6379:6379"
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 1s
            retries: 5
        restart: unless-stopped

    # Redis for LangGraph
    langgraph-redis:
        image: redis:6
        container_name: langgraph-redis
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 1s
            retries: 5

    # Backend API Service
    langgraph-api:
        image: revnixhq/wrext:${IMAGE_TAG:-latest}
        ports:
            - "8123:2024"
        depends_on:
            langgraph-redis:
                condition: service_healthy
        environment:
            # Core API + Database
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
            LANGSMITH_DEV_URL: ${LANGSMITH_DEV_URL:-http://127.0.0.1:2024}
            LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-WREXT}
            LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
            COHERE_API_KEY: ${COHERE_API_KEY}

            # Database (Connect to host PostgreSQL)
            POSTGRES_URI_CUSTOM: ${POSTGRES_URI_CUSTOM}
            DATABASE_URI: ${DATABASE_URI}
            REDIS_URI: ${REDIS_URI:-redis://langgraph-redis:6379}
            REDIS_URL: ${REDIS_URL:-redis://langgraph-redis:6379}
            CACHE_URL: ${CACHE_URL:-redis://langgraph-redis:6379}

            # Security
            SECRET_KEY: ${SECRET_KEY}
            REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
            ALGORITHM: ${ALGORITHM:-HS256}

            # Server
            HOST: ${HOST:-0.0.0.0}
            PORT: ${PORT:-2024}

            # Frontend + CORS
            FRONTEND_URL: ${FRONTEND_URL}
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
            ENVIRONMENT: ${ENVIRONMENT:-production}
            DEBUG: ${DEBUG:-false}

            # Rate Limiting
            RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
            RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1000}
            RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-10000}
            RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-100000}

            # File Uploads
            UPLOAD_DIR: ${UPLOAD_DIR:-/app/secure_uploads}
            MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
            ENABLE_VIRUS_SCAN: ${ENABLE_VIRUS_SCAN:-false}

            # Email (Resend)
            EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
            EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
            RESEND_API_KEY: ${RESEND_API_KEY}
            RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@notifications.wrext.com}
            RESEND_FROM_NAME: ${RESEND_FROM_NAME:-WREXT}
            RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
            SMTP_SERVER: ${SMTP_SERVER:-}
            SMTP_PORT: ${SMTP_PORT:-587}
            SMTP_USERNAME: ${SMTP_USERNAME:-}
            SMTP_PASSWORD: ${SMTP_PASSWORD:-}
            SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
            EMAIL_RETRY_ENABLED: ${EMAIL_RETRY_ENABLED:-true}
            EMAIL_RETRY_MAX_ATTEMPTS: ${EMAIL_RETRY_MAX_ATTEMPTS:-3}
            EMAIL_RETRY_DELAY_SECONDS: ${EMAIL_RETRY_DELAY_SECONDS:-5}

            # Payment (LemonSqueezy)
            PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-lemonsqueezy}
            PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-USD}
            PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL}
            PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL}
            LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY}
            LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID}
            LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET}
            LEMONSQUEEZY_SANDBOX_MODE: ${LEMONSQUEEZY_SANDBOX_MODE:-true}

            # AI + External
            PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}

            # Admin
            SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
            SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
            SUPER_ADMIN_FIRST_NAME: ${SUPER_ADMIN_FIRST_NAME:-Admin}
            SUPER_ADMIN_LAST_NAME: ${SUPER_ADMIN_LAST_NAME:-User}

            # Monitoring
            SENTRY_DSN: ${SENTRY_DSN}
            SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}

networks:
    wrext-network:
        driver: bridge
