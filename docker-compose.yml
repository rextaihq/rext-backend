volumes:
    langgraph-data:
        driver: local
services:
    langgraph-redis:
        image: redis:6
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 1s
            retries: 5
    langgraph-postgres:
        image: postgres:16
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - langgraph-data:/var/lib/postgresql/data
        healthcheck:
            test: pg_isready -U postgres
            start_period: 10s
            timeout: 1s
            retries: 5
            interval: 5s
    langgraph-api:
        image: content-automation2:latest
        ports:
            - "8123:8000"
        depends_on:
            langgraph-redis:
                condition: service_healthy
            langgraph-postgres:
                condition: service_healthy
        env_file:
            - .env
        environment:
            REDIS_URI: redis://langgraph-redis:6379
            LANGSMITH_API_KEY: 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
            POSTGRES_URI_CUSTOM: postgresql://postgres:postgres@langgraph-postgres:5432/postgres
            DATABASE_URI: ostgresql://postgres:postgres@langgraph-postgres:5432/postgres
            SECRET_KEY: revnix
            REFRESH_SECRET_KEY: revnixrefresh
            ALGORITHM: HS256
            TAVILY_API_KEY: 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