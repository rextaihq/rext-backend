version: "3.9"

volumes:
    langgraph-data:
        driver: local

services:
    # ================= REDIS (CACHE) =================
    redis:
        image: redis:7-alpine
        command: >
            redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 2s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 1.2G
        restart: unless-stopped
        networks:
            - rext-network

    # ================= REDIS (LANGGRAPH) =================
    langgraph-redis:
        image: redis:6
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 2s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 1.2G
        restart: unless-stopped
        networks:
            - rext-network

    # ================= POSTGRES =================
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: exec
            POSTGRES_PASSWORD: rextserver
            POSTGRES_DB: rext
        volumes:
            - langgraph-data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U exec" ]
            interval: 5s
            timeout: 2s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 2G
        restart: unless-stopped
        networks:
            - rext-network

    # ================= API (LOAD BALANCED) =================
    rext-api:
        image: revnixhq/wrext:${IMAGE_TAG:-dev}

        deploy:
            replicas: 3 # 👈 Load balanced
            resources:
                limits:
                    cpus: "0.8"
                    memory: 1.4G
                reservations:
                    cpus: "0.3"
                    memory: 1G

        expose:
            - "2024"

        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.rext-api.rule=Host(`api.rext.ai`)"
            - "traefik.http.routers.rext-api.entrypoints=https"
            - "traefik.http.routers.rext-api.tls=true"
            - "traefik.http.routers.rext-api.tls.certresolver=letsencrypt"
            - "traefik.http.services.rext-api.loadbalancer.server.port=2024"
            # Optional sticky sessions (enable if WebSockets / long jobs)
            # - "traefik.http.services.rext-api.loadbalancer.sticky.cookie=true"

        depends_on:
            postgres:
                condition: service_healthy
            langgraph-redis:
                condition: service_healthy

        env_file:
            - .env

        environment:
            HOST: 0.0.0.0
            PORT: 2024

            DATABASE_URI: postgresql://exec:rextserver@postgres:5432/rext
            POSTGRES_URI_CUSTOM: postgresql://exec:rextserver@postgres:5432/rext

            REDIS_URL: redis://langgraph-redis:6379
            REDIS_URI: redis://langgraph-redis:6379
            CACHE_URL: redis://langgraph-redis:6379

            WORKER_CONCURRENCY: 2
            N_JOBS_PER_WORKER: 40

            REDIS_MAX_CONNECTIONS: "40"

            CHECKPOINTER_TTL_DEFAULT: 86400
            STORE_TTL_DEFAULT: 604800

            ENVIRONMENT: production
            DEBUG: "false"

        networks:
            - rext-network
            - coolify

networks:
    rext-network:
        driver: bridge
    coolify:
        external: true
