volumes:
    langgraph-data:
        driver: local
services:
    # Redis for application cache
    redis:
        image: redis:7-alpine
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 1s
            retries: 5
        restart: unless-stopped
        networks:
            - rext-network

    # Redis for LangGraph
    langgraph-redis:
        image: redis:6
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 1s
            retries: 5
        networks:
            - rext-network

    # Postgres Databases and also add some other secrets
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: exec
            POSTGRES_PASSWORD: rextserver
            POSTGRES_DB: rext
        volumes:
            - langgraph-data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U exec" ]
            interval: 5s
            retries: 5
        networks:
            - rext-network

    # Backend API Service
    # Full Traefik labels required — Coolify UI Domains does NOT auto-generate
    # labels for docker-compose services.
    langgraph-api:
        image: revnixhq/wrext:${IMAGE_TAG:-dev}
        expose:
            - "2024"
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.rext-api.rule=Host(`api.rext.ai`)"
            - "traefik.http.routers.rext-api.entrypoints=https"
            - "traefik.http.routers.rext-api.tls=true"
            - "traefik.http.routers.rext-api.tls.certresolver=letsencrypt"
            - "traefik.http.services.rext-api.loadbalancer.server.port=2024"
        networks:
            - rext-network
            - coolify
        depends_on:
            postgres:
                condition: service_healthy
            langgraph-redis:
                condition: service_healthy
        env_file:
            - .env
        environment:
            # Core API + Database
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
            LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-REXT}
            LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}

            # Database (Connect to host PostgreSQL)
            POSTGRES_URI_CUSTOM: postgresql://exec:rextserver@postgres:5432/rext
            DATABASE_URI: postgresql://exec:rextserver@postgres:5432/rext
            REDIS_URI: ${REDIS_URI:-redis://langgraph-redis:6379}
            REDIS_URL: ${REDIS_URL:-redis://langgraph-redis:6379}
            CACHE_URL: ${CACHE_URL:-redis://langgraph-redis:6379}

            # Security
            SECRET_KEY: ${SECRET_KEY}
            REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
            ALGORITHM: ${ALGORITHM:-HS256}

            # Server
            HOST: ${HOST:-0.0.0.0}
            PORT: ${PORT:-2024}

            # Frontend + CORS
            FRONTEND_URL: ${FRONTEND_URL}
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
            ENVIRONMENT: ${ENVIRONMENT:-production}
            DEBUG: ${DEBUG:-false}

            # Rate Limiting
            RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
            RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1000}
            RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-10000}
            RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-100000}

            # File Uploads
            UPLOAD_DIR: ${UPLOAD_DIR:-/app/secure_uploads}
            MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
            ENABLE_VIRUS_SCAN: ${ENABLE_VIRUS_SCAN:-false}

            # Email (Resend)
            EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
            EMAIL_ENABLED: ${EMAIL_ENABLED:-true}

            # Resend
            RESEND_API_KEY: ${RESEND_API_KEY}
            RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
            RESEND_FROM_NAME: ${RESEND_FROM_NAME}
            RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
            SMTP_SERVER: ${SMTP_SERVER:-}
            SMTP_PORT: ${SMTP_PORT:-587}
            SMTP_USERNAME: ${SMTP_USERNAME:-}
            SMTP_PASSWORD: ${SMTP_PASSWORD:-}
            SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
            EMAIL_RETRY_ENABLED: ${EMAIL_RETRY_ENABLED:-true}
            EMAIL_RETRY_MAX_ATTEMPTS: ${EMAIL_RETRY_MAX_ATTEMPTS:-3}
            EMAIL_RETRY_DELAY_SECONDS: ${EMAIL_RETRY_DELAY_SECONDS:-5}

            # Payment (LemonSqueezy)
            PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-lemonsqueezy}
            PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-USD}
            PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL}
            PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL}

            # AI + External
            PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
            SERPER_API_KEY: ${SERPER_API_KEY}

            # Admin
            SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
            SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
            SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME:-Samiullah}

            # Monitoring
            SENTRY_DSN: ${SENTRY_DSN}
            SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
            CACHE_ENABLED: ${CACHE_ENABLED:-false}

            # Feature Flags
            FF_PROFILE_IMPORTS: ${FF_PROFILE_IMPORTS:-false}
            BG_JOB_ISOLATED_LOOPS: ${BG_JOB_ISOLATED_LOOPS:-false}

            # Payment
            LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET}
            LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY}
            LEMONSQUEEZY_SANDBOX_MODE: ${LEMONSQUEEZY_SANDBOX_MODE}
            LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID}

networks:
    rext-network:
        driver: bridge
    coolify:
        external: true
