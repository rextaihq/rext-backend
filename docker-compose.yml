services:
    # Redis for application cache
    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 1s
            retries: 5
        restart: unless-stopped
        networks:
            - rext-network

    # Redis for LangGraph
    langgraph-redis:
        image: redis:7-alpine
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 5s
            timeout: 1s
            retries: 5
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 512M
        networks:
            - rext-network

    # Postgres Databases and also add some other secrets
    postgres:
        image: pgvector/pgvector:pg17
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - langgraph-data:/var/lib/postgresql/data
            - pg-socket:/var/run/postgresql
        expose:
            - "5432"
        command: >
            postgres
            -c shared_buffers=2GB
            -c effective_cache_size=6GB
            -c maintenance_work_mem=512MB
            -c work_mem=10MB
            -c wal_buffers=64MB
            -c min_wal_size=1GB
            -c max_wal_size=4GB
            -c checkpoint_completion_target=0.9
            -c random_page_cost=1.1
            -c effective_io_concurrency=200
            -c default_statistics_target=100
            -c max_worker_processes=4
            -c max_parallel_workers_per_gather=2
            -c max_parallel_workers=4
            -c max_parallel_maintenance_workers=2
            -c huge_pages=off
            -c jit=off
            -c max_connections=200
            -c statement_timeout=60000
            -c idle_in_transaction_session_timeout=300000
            -c log_min_duration_statement=1000
            -c shared_preload_libraries=pg_stat_statements
        deploy:
            resources:
                limits:
                    memory: 2G
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
            interval: 5s
            retries: 5
        networks:
            - rext-network

    # One-time helper: syncs the live Postgres role password to match POSTGRES_PASSWORD
    # (fixes drift after the value changes post-initdb on an existing data volume)
    pg-password-sync:
        image: postgres:17-alpine
        restart: "no"
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - pg-socket:/var/run/postgresql
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        entrypoint: ["sh", "-c"]
        command:
            - >
              psql -v ON_ERROR_STOP=1 -h /var/run/postgresql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
              -c "ALTER ROLE \"$$POSTGRES_USER\" WITH PASSWORD '$$POSTGRES_PASSWORD';"
        networks:
            - rext-network

    # PgBouncer — connection pooler between app and Postgres
    pgbouncer:
        image: edoburu/pgbouncer:latest
        restart: unless-stopped
        entrypoint: ["sh", "-c", "rm -f /etc/pgbouncer/userlist.txt /etc/pgbouncer/pgbouncer.ini; exec /entrypoint.sh /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini"]
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_NAME: ${POSTGRES_DB}
            DB_USER: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            POOL_MODE: transaction
            MAX_CLIENT_CONN: "1000"
            DEFAULT_POOL_SIZE: "25"
            AUTH_TYPE: scram-sha-256
            SERVER_TLS_SSLMODE: disable
            IGNORE_STARTUP_PARAMETERS: extra_float_digits,prepare_threshold,statement_timeout,idle_in_transaction_session_timeout,lock_timeout
        ports:
            - "6432:5432"
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER}"]
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - rext-network

    # Backend API Service
    rext-api:
        image: ghcr.io/rextaihq/rext-backend:${IMAGE_TAG:-latest}
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=coolify"
        deploy:
            replicas: 1 # Set to 1 to avoid 'container name must be unique' error in Coolify
            resources:
                limits:
                    cpus: '2.0'
                    memory: 2.5G
                reservations:
                    cpus: '0.5'
                    memory: 1.5G
        expose:
            - ${PORT:-2024}
        ulimits:
            nofile:
                soft: 65536
                hard: 65536

        # Traefik labels are managed by Coolify — do not uncomment these manually
        # See Coolify dashboard > Applications > rext-backend for routing config
        networks:
            - rext-network
            - coolify
        depends_on:
            pgbouncer:
                condition: service_healthy
            langgraph-redis:
                condition: service_healthy
        env_file:
            - .env
        environment:
            # Core API + Database
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
            LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-REXT}
            LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}

            # Database — route through PgBouncer
            # prepare_threshold=0 disables psycopg3 prepared statements (required for transaction pooling mode)
            POSTGRES_URI_CUSTOM: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
            DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
            REDIS_URI: ${REDIS_URI:-redis://langgraph-redis:6379}
            REDIS_URL: ${REDIS_URL:-redis://redis:6379}
            CACHE_URL: ${CACHE_URL:-redis://redis:6379}

            # Security
            SECRET_KEY: ${SECRET_KEY}
            REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
            ALGORITHM: ${ALGORITHM:-HS256}

            # Server
            HOST: ${HOST:-0.0.0.0}
            PORT: ${PORT}

            # Frontend + CORS
            FRONTEND_URL: ${FRONTEND_URL}
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
            ENVIRONMENT: ${ENVIRONMENT}
            DEBUG: ${DEBUG:-false}

            # Rate Limiting
            RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
            RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1000}
            RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-10000}
            RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-100000}

            # File Uploads
            UPLOAD_DIR: ${UPLOAD_DIR:-/app/secure_uploads}
            MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
            ENABLE_VIRUS_SCAN: ${ENABLE_VIRUS_SCAN:-false}

            # Email (Resend)
            EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
            EMAIL_ENABLED: ${EMAIL_ENABLED:-true}

            # Resend
            RESEND_API_KEY: ${RESEND_API_KEY}
            RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
            RESEND_FROM_NAME: ${RESEND_FROM_NAME}
            RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
            SMTP_SERVER: ${SMTP_SERVER}
            SMTP_PORT: ${SMTP_PORT}
            SMTP_USERNAME: ${SMTP_USERNAME}
            SMTP_PASSWORD: ${SMTP_PASSWORD}
            SMTP_USE_TLS: ${SMTP_USE_TLS}
            EMAIL_RETRY_ENABLED: ${EMAIL_RETRY_ENABLED}
            EMAIL_RETRY_MAX_ATTEMPTS: ${EMAIL_RETRY_MAX_ATTEMPTS}
            EMAIL_RETRY_DELAY_SECONDS: ${EMAIL_RETRY_DELAY_SECONDS}

            # Payment (LemonSqueezy)
            PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-lemonsqueezy}
            PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-USD}
            PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL}
            PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL}


            # Admin
            SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
            SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
            SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME}

            # Monitoring
            SENTRY_DSN: ${SENTRY_DSN}
            SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
            CACHE_ENABLED: ${CACHE_ENABLED:-true}

            # Feature Flags
            FF_PROFILE_IMPORTS: ${FF_PROFILE_IMPORTS:-false}
            BG_JOB_ISOLATED_LOOPS: "true"
            N_JOBS_PER_WORKER: "50"

            # Connection pooling — PgBouncer handles the Postgres side, keep client pools small
            REDIS_MAX_CONNECTIONS: "50"
            POSTGRES_POOL_SIZE: "5"
            POSTGRES_MAX_OVERFLOW: "5"

            # TTL - CRITICAL for 8GB (auto-delete old threads)
            CHECKPOINTER_TTL_DEFAULT: 86400 # 24hr
            STORE_TTL_DEFAULT: 604800 # 7 days

            # Efficiency
            WORKER_CONCURRENCY: 2

            # Payment
            LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET}
            LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY}
            LEMONSQUEEZY_SANDBOX_MODE: ${LEMONSQUEEZY_SANDBOX_MODE}
            LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID}

            # Encription
            FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}

            # Data For Seo
            DATAFORSEO_AUTH_HEADER: ${DATAFORSEO_AUTH_HEADER}
            DATAFORSEO_SERP_URL: ${DATAFORSEO_SERP_URL}
            DATAFORSEO_BACKLINKS_URL: ${DATAFORSEO_BACKLINKS_URL}

            # Tavily Search
            TAVILY_API_KEY: ${TAVILY_API_KEY}

            # MinIO Storage
            MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
            MINIO_BUCKET: ${MINIO_BUCKET:-rext-media}
            MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
            MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}

            # Shopify App Bridge
            SHOPIFY_APP_SLUG: ${SHOPIFY_APP_SLUG:-rext-publisher-1}
            SHOPIFY_APP_ENTRY_PATH: ${SHOPIFY_APP_ENTRY_PATH:-/app/blogpost}
            SHOPIFY_BRIDGE_BASE_URL: ${SHOPIFY_BRIDGE_BASE_URL}
            SHOPIFY_BRIDGE_PUBLISH_ENDPOINT: ${SHOPIFY_BRIDGE_PUBLISH_ENDPOINT:-/app/api/rext/publish}
            SHOPIFY_BRIDGE_SHARED_SECRET: ${SHOPIFY_BRIDGE_SHARED_SECRET}

            # Public backend base URL (used to generate absolute OAuth callback URLs)
            BACKEND_URL: ${BACKEND_URL}

            # Shopify OAuth
            SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
            SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
            SHOPIFY_INTEGRATION_RETURN_PATH: ${SHOPIFY_INTEGRATION_RETURN_PATH:-/integrations}

    # Shopify App (React Router / Node.js)
    rext-shopify-app:
        image: ghcr.io/rextaihq/rext-shopify-app:${IMAGE_TAG:-latest}
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=coolify"
        expose:
            - "3000"
        environment:
            NODE_ENV: production
            PORT: "3000"
            SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
            SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
            SHOPIFY_APP_URL: ${SHOPIFY_APP_URL}
            SCOPES: ${SHOPIFY_SCOPES:-write_products,write_metaobjects,write_metaobject_definitions,write_content}
            DATABASE_URL: ${SHOPIFY_DATABASE_URL}
            REXT_BRIDGE_SHARED_SECRET: ${SHOPIFY_BRIDGE_SHARED_SECRET}
            REXT_BACKEND_URL: ${BACKEND_URL}
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- --server-response http://127.0.0.1:3000/ 2>&1 | grep -qE 'HTTP/1\\.[01] [23]' || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        networks:
            - rext-network
            - coolify

    # MinIO Storage Service
    minio:
        image: quay.io/minio/minio:latest
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
        volumes:
            - minio_data:/data
        expose:
            - "9000"
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=coolify"
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        networks:
            - rext-network
            - coolify

networks:
    rext-network:
        driver: bridge
    coolify:
        external: true

volumes:
    langgraph-data:
        driver: local
    minio_data:
        driver: local
    pg-socket:
        driver: local
        