volumes:
    langgraph-data:
        driver: local
services:
    # Redis for application cache (separate from LangGraph)
    redis:
        image: redis:7-alpine
        container_name: wrext-redis
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 1s
            retries: 5
        restart: unless-stopped

    # Redis for LangGraph
    langgraph-redis:
        image: redis:6
        container_name: langgraph-redis
        healthcheck:
            test: redis-cli ping
            interval: 5s
            timeout: 1s
            retries: 5
    langgraph-postgres:
        image: postgres:16
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - langgraph-data:/var/lib/postgresql/data
        healthcheck:
            test: pg_isready -U postgres
            start_period: 10s
            timeout: 1s
            retries: 5
            interval: 5s
    langgraph-api:
        image: revnix/content-automation:latest
        ports:
            - "8123:2024"
        depends_on:
            langgraph-redis:
                condition: service_healthy
            langgraph-postgres:
