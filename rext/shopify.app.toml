# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "be7e0565736b18f5f7effeb263250302"
name = "rext"
application_url = "https://shopifyapp.rext.ai"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions,write_content"

[auth]
redirect_urls = [
    "https://shopifyapp.rext.ai/auth/callback",
    "https://shopifyapp.rext.ai/auth/shopify/callback",
    "https://shopifyapp.rext.ai/exitiframe",
]
