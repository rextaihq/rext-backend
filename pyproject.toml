[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "language-tool-python",
    "alembic>=1.13.0",
    "crawl4ai>=0.7.2",
    "faiss-cpu>=1.12.0",
    "fastapi[standard]>=0.116.1",
    "fastmcp>=2.12.4",
    "feedparser>=6.0.11",
    "flashrank>=0.2.10",
    "langchain-community>=0.3.27",
    "langchain-huggingface>=0.3.1",
    "langchain-tavily>=0.2.11",
    "langchain[groq,openai]>=0.3.27",
    "langgraph[cli]>=0.5.4",
    "langgraph-api>=0.2.102",
    "langgraph-checkpoint-postgres>=2.0.23",
    "langgraph-cli[inmem]>=0.3.6",
    "langgraph-sdk>=0.1.74",
    "markdown>=3.8.2",
    "numpy>=2.3.2",
    "passlib[bcrypt]>=1.7.4",
    "perplexityai>=0.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyJWT[crypto]>=2.8.0",
    "pymupdf>=1.26.4",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "user-agents>=2.2.0",
    "structlog>=25.4.0",
    "python-json-logger>=3.3.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "filetype>=1.2.0",
    "werkzeug>=3.0.1",
    "pillow>=11.3.0",
    "sse-starlette>=2.1.3",
    "resend>=2.16.0",
    "svix>=1.77.0",
    "tenacity>=8.2.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "redis[hiredis]>=5.0.0",
    "boto3>=1.40.56",
    "websockets>=15.0.1",
    "langchain-cohere>=0.5.0",
    "sentence-transformers>=5.2.0",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.0.1",
    "scikit-learn>=1.8.0",
    "textstat>=0.7.12",
    "seokar>=1.0.0",
    "language-tool-python>=3.2.2",
    "spacy>=3.8.11",
    "pip>=25.3",
]

[project.scripts]
db = "scripts.db:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "factory-boy>=3.3.1",
    "faker>=20.0.0",
    "pytest-cov>=4.1.0",
]
