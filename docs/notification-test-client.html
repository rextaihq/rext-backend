<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification SSE Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .config-section {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-section {
            padding: 30px;
            border-bottom: 1px solid #e9ecef;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-disconnected {
            background: #fee;
            color: #c00;
        }

        .status-connecting {
            background: #ffeaa7;
            color: #d63031;
        }

        .status-connected {
            background: #d4edda;
            color: #155724;
        }

        .events-section {
            padding: 30px;
            max-height: 500px;
            overflow-y: auto;
        }

        .events-section h3 {
            margin-bottom: 20px;
            color: #495057;
        }

        .event-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .event-card.success {
            border-left-color: #28a745;
            background: #d4edda;
        }

        .event-card.error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }

        .event-card.warning {
            border-left-color: #ffc107;
            background: #fff3cd;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .event-type {
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }

        .event-time {
            font-size: 12px;
            color: #6c757d;
        }

        .event-data {
            background: white;
            padding: 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            padding: 16px;
            border-radius: 8px;
            border: 2px solid #e9ecef;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .event-icon {
            font-size: 24px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .event-info {
            flex: 1;
            min-width: 0;
        }

        .event-message {
            display: block;
            color: #6c757d;
            font-size: 13px;
            margin-top: 4px;
            font-weight: 400;
        }

        .payload-details {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            font-size: 13px;
        }

        .payload-item {
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .payload-item strong {
            color: #495057;
            min-width: 100px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-role {
            background: #28a745;
        }

        .event-raw-data {
            margin-top: 12px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            padding-top: 12px;
        }

        .event-raw-data summary {
            cursor: pointer;
            color: #667eea;
            font-size: 12px;
            font-weight: 600;
            user-select: none;
            padding: 4px 0;
        }

        .event-raw-data summary:hover {
            color: #764ba2;
        }

        .event-raw-data pre {
            margin-top: 8px;
            padding: 12px;
            background: white;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }

        .event-header {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .event-card.info {
            border-left-color: #17a2b8;
            background: #d1ecf1;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔔 Notification SSE Test Client</h1>
            <p>Test real-time notification events from the backend</p>
        </div>

        <div class="config-section">
            <div class="form-group">
                <label for="backendUrl">Backend URL</label>
                <input type="text" id="backendUrl" placeholder="http://127.0.0.1:2024" value="http://127.0.0.1:2024">
            </div>

            <div class="form-group">
                <label for="userId">Operation ID (format: user-notifications-{YOUR_USER_ID})</label>
                <input type="text" id="userId" placeholder="user-notifications-8f7aae52-8aac-426b-8648-fc144c17ac43"
                    value="user-notifications-8f7aae52-8aac-426b-8648-fc144c17ac43">
            </div>

            <div class="form-group">
                <label for="authToken">JWT Token (from browser localStorage or cookies)</label>
                <input type="password" id="authToken" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
            </div>

            <div class="button-group">
                <button class="btn-primary" id="connectBtn" onclick="connect()">
                    Connect to SSE
                </button>
                <button class="btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>
                    Disconnect
                </button>
                <button class="btn-secondary" onclick="clearEvents()">
                    Clear Events
                </button>
            </div>
        </div>

        <div class="status-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong>Connection Status:</strong>
                    <span class="status-badge status-disconnected" id="statusBadge">Disconnected</span>
                </div>
                <div id="connectionUrl" style="font-size: 12px; color: #6c757d;"></div>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalEvents">0</div>
                    <div class="stat-label">Total Events</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="successEvents">0</div>
                    <div class="stat-label">Success</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="errorEvents">0</div>
                    <div class="stat-label">Errors</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="uptime">0s</div>
                    <div class="stat-label">Uptime</div>
                </div>
            </div>
        </div>

        <div class="events-section">
            <h3>📨 Received Events</h3>
            <div id="eventsContainer">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4">
                        </path>
                    </svg>
                    <p>No events received yet. Connect to start listening.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let eventCount = 0;
        let successCount = 0;
        let errorCount = 0;
        let startTime = null;
        let uptimeInterval = null;

        function updateStatus(status, message) {
            const badge = document.getElementById('statusBadge');
            badge.className = 'status-badge status-' + status;
            badge.textContent = message;
        }

        function updateStats() {
            document.getElementById('totalEvents').textContent = eventCount;
            document.getElementById('successEvents').textContent = successCount;
            document.getElementById('errorEvents').textContent = errorCount;
        }

        function updateUptime() {
            if (!startTime) return;
            const seconds = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);

            if (hours > 0) {
                document.getElementById('uptime').textContent = `${hours}h ${minutes % 60}m`;
            } else if (minutes > 0) {
                document.getElementById('uptime').textContent = `${minutes}m ${seconds % 60}s`;
            } else {
                document.getElementById('uptime').textContent = `${seconds}s`;
            }
        }

        function getNotificationIcon(scope, step, payload) {
            // Connection events
            if (scope === 'connection') return '🔌';

            // Knowledge base events
            if (payload?.type === 'text') return '📝';
            if (payload?.type === 'web') return '🌐';
            if (payload?.type === 'file') return '📄';

            // Workspace events
            if (payload?.workspace_id) {
                if (step === 'success' && payload?.invitation_id) return '📨';
                if (payload?.removed_by) return '🚪';
                if (payload?.new_role) return '👤';
            }

            // Default icons based on step
            if (step === 'success') return '✅';
            if (step === 'error' || step === 'failed') return '❌';
            if (step === 'warning') return '⚠️';
            if (step === 'info') return 'ℹ️';

            return '🔔';
        }

        function formatNotificationPayload(payload) {
            if (!payload || Object.keys(payload).length === 0) return '';

            let html = '<div class="payload-details">';

            // Knowledge base notifications
            if (payload.knowledge_id) {
                html += `<div class="payload-item"><strong>Knowledge ID:</strong> ${payload.knowledge_id}</div>`;
                html += `<div class="payload-item"><strong>Type:</strong> <span class="badge">${payload.type}</span></div>`;
            }

            // Workspace invitation
            if (payload.invitation_id) {
                html += `<div class="payload-item"><strong>Workspace:</strong> ${payload.workspace_name}</div>`;
                html += `<div class="payload-item"><strong>Role:</strong> <span class="badge badge-role">${payload.role_name}</span></div>`;
                html += `<div class="payload-item"><strong>Invited by:</strong> ${payload.invited_by}</div>`;
            }

            // Role change
            if (payload.new_role) {
                html += `<div class="payload-item"><strong>New Role:</strong> <span class="badge badge-role">${payload.new_role.display_name}</span></div>`;
            }

            // Member removal
            if (payload.removed_by && !payload.new_role) {
                html += `<div class="payload-item"><strong>Workspace ID:</strong> ${payload.workspace_id}</div>`;
            }

            html += '</div>';
            return html;
        }

        function addEvent(type, data, eventType = 'info') {
            const container = document.getElementById('eventsContainer');

            // Remove empty state if exists
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const eventCard = document.createElement('div');

            // Determine event type based on data
            let cardType = eventType;
            if (data.scope === 'connection') {
                cardType = 'info';
            } else if (data.step === 'success') {
                cardType = 'success';
            } else if (data.step === 'error' || data.step === 'failed') {
                cardType = 'error';
            } else if (data.step === 'warning') {
                cardType = 'warning';
            }

            eventCard.className = `event-card ${cardType}`;

            const now = new Date().toLocaleTimeString();
            const icon = getNotificationIcon(data.scope, data.step, data.payload);
            const payloadHtml = formatNotificationPayload(data.payload);

            // Format timestamp if available
            let timestamp = now;
            if (data.timestamp) {
                const date = new Date(data.timestamp);
                timestamp = date.toLocaleTimeString();
            }

            eventCard.innerHTML = `
                <div class="event-header">
                    <span class="event-icon">${icon}</span>
                    <div class="event-info">
                        <span class="event-type">${type}</span>
                        <span class="event-message">${data.message || 'No message'}</span>
                    </div>
                    <span class="event-time">${timestamp}</span>
                </div>
                ${payloadHtml}
                <details class="event-raw-data">
                    <summary>View Raw Data</summary>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </details>
            `;

            container.insertBefore(eventCard, container.firstChild);

            // Keep only last 50 events
            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }

            eventCount++;
            if (cardType === 'success') successCount++;
            if (cardType === 'error') errorCount++;
            updateStats();
        }

        function connect() {
            const backendUrl = document.getElementById('backendUrl').value.trim();
            const userId = document.getElementById('userId').value.trim();
            const authToken = document.getElementById('authToken').value.trim();

            if (!backendUrl || !userId) {
                alert('Please provide Backend URL and Operation ID');
                return;
            }

            // Close existing connection
            if (eventSource) {
                eventSource.close();
            }

            // Build SSE URL
            let sseUrl = `${backendUrl}/api/v1/events/${userId}`;

            // Add token as query parameter if provided (for EventSource compatibility)
            if (authToken) {
                sseUrl += `?token=${encodeURIComponent(authToken)}`;
            }

            document.getElementById('connectionUrl').textContent = sseUrl;

            updateStatus('connecting', 'Connecting...');
            addEvent('Connection', { url: sseUrl, timestamp: new Date().toISOString() }, 'info');

            try {
                eventSource = new EventSource(sseUrl);

                eventSource.onopen = function (event) {
                    updateStatus('connected', 'Connected');
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                    startTime = Date.now();
                    uptimeInterval = setInterval(updateUptime, 1000);
                    addEvent('Connection Opened', { status: 'success' }, 'success');
                };

                eventSource.onmessage = function (event) {
                    console.log('SSE Message:', event);
                    try {
                        const data = JSON.parse(event.data);
                        const eventType = data.type || data.step || 'unknown';
                        const isError = data.status === 'failed' || data.type?.includes('error') || data.type?.includes('failed');
                        addEvent(eventType, data, isError ? 'error' : 'success');
                    } catch (e) {
                        addEvent('Raw Message', { data: event.data }, 'warning');
                    }
                };

                eventSource.onerror = function (event) {
                    console.error('SSE Error:', event);
                    addEvent('Connection Error', {
                        readyState: eventSource.readyState,
                        timestamp: new Date().toISOString()
                    }, 'error');

                    if (eventSource.readyState === EventSource.CLOSED) {
                        updateStatus('disconnected', 'Connection Closed');
                        document.getElementById('connectBtn').disabled = false;
                        document.getElementById('disconnectBtn').disabled = true;
                        if (uptimeInterval) {
                            clearInterval(uptimeInterval);
                            uptimeInterval = null;
                        }
                    }
                };

                // Listen for custom event types
                const eventTypes = [
                    'kb_processing_completed',
                    'kb_processing_failed',
                    'workspace_invitation',
                    'role_changed',
                    'content_generation_completed',
                    'notification.success',
                    'notification.error',
                    'notification.info'
                ];

                eventTypes.forEach(type => {
                    eventSource.addEventListener(type, function (event) {
                        console.log(`Custom Event [${type}]:`, event);
                        try {
                            const data = JSON.parse(event.data);
                            addEvent(type, data, type.includes('error') || type.includes('failed') ? 'error' : 'success');
                        } catch (e) {
                            addEvent(type, { data: event.data }, 'warning');
                        }
                    });
                });

            } catch (error) {
                console.error('Connection error:', error);
                updateStatus('disconnected', 'Connection Failed');
                addEvent('Connection Failed', { error: error.message }, 'error');
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
            }
        }

        function disconnect() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            updateStatus('disconnected', 'Disconnected');
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            if (uptimeInterval) {
                clearInterval(uptimeInterval);
                uptimeInterval = null;
            }
            startTime = null;
            addEvent('Disconnected', { timestamp: new Date().toISOString() }, 'warning');
        }

        function clearEvents() {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                    </svg>
                    <p>Events cleared. Waiting for new events...</p>
                </div>
            `;
            eventCount = 0;
            successCount = 0;
            errorCount = 0;
            updateStats();
        }

        // Auto-fill token from localStorage if available
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('auth_token') || localStorage.getItem('token');
            if (token) {
                document.getElementById('authToken').value = token;
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</body>

</html>
